<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📸 班級互動相片牆 - 教師後台與班級分流中心</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #0b0f19 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="flex flex-col justify-between p-4 sm:p-8 antialiased">

  <!-- ============================================================
       頂部 Header & 教師登入區
  ============================================================= -->
  <header class="max-w-5xl mx-auto w-full flex items-center justify-between py-4 border-b border-white/10 shrink-0">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-2xl shadow-lg shadow-indigo-500/30">
        <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">班級互動相片牆</h1>
        <p class="text-xs text-indigo-200 font-medium">多班級獨立分流系統 • 虛擬房間隔離</p>
      </div>
    </div>

    <!-- 教師帳號狀態 / Google 登入按鈕 -->
    <div id="authArea" class="flex items-center gap-3">
      <!-- 登入前 -->
      <div id="loggedOutView" class="flex items-center gap-2">
        <button onclick="loginWithGoogle()" class="flex items-center gap-2 bg-white hover:bg-gray-100 text-gray-900 font-bold px-4 py-2 rounded-xl text-xs sm:text-sm shadow-md transition transform active:scale-95">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google 登入</span>
        </button>
      </div>

      <!-- 登入後 -->
      <div id="loggedInView" class="hidden flex items-center gap-3">
        <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-xl border border-white/10">
          <img id="userAvatar" src="" class="w-6 h-6 rounded-full border border-white/30" />
          <span id="userName" class="text-xs font-bold text-gray-200">教師</span>
        </div>
        <button onclick="logout()" class="text-xs text-gray-400 hover:text-white underline">登出</button>
      </div>
    </div>
  </header>

  <!-- ============================================================
       主要操作大廳 (Portal Lobby)
  ============================================================= -->
  <main class="max-w-5xl mx-auto w-full my-8 space-y-8 flex-1">

    <!-- 區塊 1: 建立新相片牆 & 快速輸入代碼進入 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- ➕ 建立新班級相片牆 (2欄寬) -->
      <div class="md:col-span-2 glass-card rounded-3xl p-6 sm:p-8 space-y-5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3 text-indigo-400">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            <h2 class="text-xl font-black text-white">建立新的班級相片牆</h2>
          </div>
          <span class="text-[11px] font-bold px-2.5 py-1 bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30">
            一鍵自動配發專屬代碼
          </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-300 mb-1.5">班級 / 活動名稱：</label>
            <input type="text" id="roomNameInput" placeholder="例如：6年1班 畢業同樂會" class="w-full px-4 py-3 text-sm bg-black/50 border border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-white font-medium" />
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-bold text-gray-300">專屬代碼 (虛擬ID)：</label>
              <button onclick="refreshRandomCode()" class="text-[11px] text-indigo-300 hover:text-indigo-200 font-bold flex items-center gap-1">
                <i data-lucide="refresh-cw" class="w-3 h-3"></i>隨機換一組
              </button>
            </div>
            <input type="text" id="roomCodeInput" class="w-full px-4 py-3 text-sm bg-black/50 border border-indigo-500/40 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-indigo-300 font-mono font-bold" />
          </div>
        </div>

        <button onclick="createNewRoom()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl transition transform active:scale-98">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
          <span>立即建立專屬班級相片牆</span>
        </button>
      </div>

      <!-- 🔍 輸入代碼直接加入 (1欄寬) -->
      <div class="glass-card rounded-3xl p-6 sm:p-8 flex flex-col justify-between space-y-4">
        <div>
          <div class="flex items-center gap-2 text-purple-400 mb-2">
            <i data-lucide="key" class="w-5 h-5"></i>
            <h2 class="text-lg font-black text-white">已有班級代碼？</h2>
          </div>
          <p class="text-xs text-gray-400 leading-relaxed">
            輸入其他老師或已建立的代碼，直接開啟大螢幕或上傳端：
          </p>
        </div>

        <div class="space-y-3">
          <input type="text" id="quickCodeInput" placeholder="例如：sjps-0904-8a" class="w-full px-4 py-2.5 text-sm bg-black/50 border border-gray-700 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none text-white font-mono text-center uppercase" />
          
          <div class="grid grid-cols-2 gap-2">
            <button onclick="quickJoin('screen')" class="flex items-center justify-center gap-1 bg-indigo-600/80 hover:bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs transition">
              <i data-lucide="tv" class="w-3.5 h-3.5"></i>開大螢幕
            </button>
            <button onclick="quickJoin('upload')" class="flex items-center justify-center gap-1 bg-pink-600/80 hover:bg-pink-600 text-white font-bold py-2.5 rounded-xl text-xs transition">
              <i data-lucide="camera" class="w-3.5 h-3.5"></i>去上傳照
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- 區塊 2: 班級相片牆清單 (Rooms List) -->
    <div class="glass-card rounded-3xl p-6 sm:p-8 space-y-5">
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <div class="flex items-center gap-3">
          <i data-lucide="layout-grid" class="w-6 h-6 text-indigo-400"></i>
          <div>
            <h2 class="text-xl font-black text-white">現有班級相片牆清單</h2>
            <p class="text-xs text-gray-400">各班級互不干擾，照片獨立存放於各自專屬代碼下</p>
          </div>
        </div>
        <span id="roomCountBadge" class="text-xs font-bold px-3 py-1 bg-white/10 rounded-full text-gray-300">
          共 0 個相片牆
        </span>
      </div>

      <!-- 房間卡片列表網格 -->
      <div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pt-2">
        <div class="col-span-full text-center py-12 text-gray-400 text-sm">
          載入班級清單中...
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 py-4 max-w-5xl mx-auto w-full border-t border-white/10">
    <p>班級互動相片牆系統 • 支援 Google 帳號分流與 Firebase 雲端獨立儲存</p>
  </footer>

  <!-- ============================================================
       JavaScript 邏輯
  ============================================================= -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAwlHmSdP4FrGZUmZe7JnL28BcCq09n1P8",
      authDomain: "test-49c68.firebaseapp.com",
      projectId: "test-49c68",
      storageBucket: "test-49c68.firebasestorage.app",
      messagingSenderId: "32127977122",
      appId: "1:32127977122:web:d0c5180e4d89ef680db9fb",
      measurementId: "G-045MJCDSQN"
    };

    let auth = null;
    let db = null;
    let currentUser = null;
    let activeRooms = [];

    function initFirebase() {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();

      auth.onAuthStateChanged(user => {
        currentUser = user;
        updateAuthUI(user);
        listenToRooms();
      });
    }

    function updateAuthUI(user) {
      const loggedOutView = document.getElementById("loggedOutView");
      const loggedInView = document.getElementById("loggedInView");
      if (user) {
        loggedOutView.classList.add("hidden");
        loggedInView.classList.remove("hidden");
        document.getElementById("userName").innerText = user.displayName || user.email || "教師";
        document.getElementById("userAvatar").src = user.photoURL || "https://api.dicebear.com/7.x/bottts/svg?seed=" + user.uid;
      } else {
        loggedOutView.classList.remove("hidden");
        loggedInView.classList.add("hidden");
      }
    }

    async function loginWithGoogle() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
      } catch(err) {
        console.warn("Google 登入取消或受限:", err.message);
        if (err.code === "auth/configuration-not-found" || err.code === "auth/operation-not-allowed") {
          alert("💡 提示：若 Firebase Console 尚未開啟 Google 登入，你依然可以直接建立班級房間並分流使用！");
        } else {
          alert("登入提示：" + err.message);
        }
      }
    }

    async function logout() {
      await auth.signOut();
    }

    // ==========================================
    // 專屬虛擬 ID 生成器 (如 sjps-0904-7a)
    // ==========================================
    function generateRoomCode() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let rand = '';
      for (let i = 0; i < 2; i++) {
        rand += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `sjps-${mm}${dd}-${rand}`;
    }

    function refreshRandomCode() {
      document.getElementById("roomCodeInput").value = generateRoomCode();
    }

    // ==========================================
    // 建立新房間
    // ==========================================
    async function createNewRoom() {
      const name = document.getElementById("roomNameInput").value.trim() || "未命名班級相片牆";
      const code = document.getElementById("roomCodeInput").value.trim().toLowerCase() || generateRoomCode();

      try {
        const roomDoc = {
          code: code,
          name: name,
          creatorUid: currentUser ? currentUser.uid : "anonymous",
          creatorEmail: currentUser ? currentUser.email : "現場教師",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          timestamp: Date.now()
        };

        await db.collection("rooms").doc(code).set(roomDoc, { merge: true });

        // 本地記錄最近建立
        let myRecent = JSON.parse(localStorage.getItem("MY_RECENT_ROOMS") || "[]");
        if (!myRecent.includes(code)) myRecent.unshift(code);
        localStorage.setItem("MY_RECENT_ROOMS", JSON.stringify(myRecent.slice(0, 15)));

        document.getElementById("roomNameInput").value = "";
        refreshRandomCode();

        alert(`🎉 成功建立【${name}】！\n專屬代碼：${code}\n現在可以立即開啟大螢幕或發送手機上傳連結囉！`);
      } catch(err) {
        console.error("建立房間失敗:", err);
        alert("建立失敗：" + err.message);
      }
    }

    // ==========================================
    // 監聽並渲染房間清單
    // ==========================================
    function listenToRooms() {
      db.collection("rooms")
        .orderBy("timestamp", "desc")
        .limit(50)
        .onSnapshot(snapshot => {
          activeRooms = [];
          snapshot.forEach(doc => {
            activeRooms.push({ id: doc.id, ...doc.data() });
          });
          renderRoomsGrid();
        }, err => {
          console.warn("Rooms 監聽錯誤:", err);
          // 若無權限或尚未建立集合，讀取本地建立過的房間
          renderFallbackRooms();
        });
    }

    function renderRoomsGrid() {
      const grid = document.getElementById("roomsGrid");
      grid.innerHTML = "";
      document.getElementById("roomCountBadge").innerText = `共 ${activeRooms.length} 個相片牆`;

      if (activeRooms.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
            <p class="text-sm">目前尚無班級相片牆，請在上列建立第一個班級！</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      activeRooms.forEach(room => {
        const card = document.createElement("div");
        card.className = "glass-panel rounded-2xl p-5 flex flex-col justify-between space-y-4 hover:border-indigo-400/50 transition duration-300 shadow-xl";
        
        const isMine = currentUser && room.creatorUid === currentUser.uid;

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2">
              <span class="px-2.5 py-1 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-lg text-xs font-mono font-bold">
                ${room.code}
              </span>
              ${isMine ? '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">我建立的</span>' : ''}
            </div>
            <h3 class="text-base font-black text-white mt-2 truncate">${room.name}</h3>
            <p class="text-xs text-gray-400 mt-0.5 font-mono">建立者: ${room.creatorEmail || '教師'}</p>
          </div>

          <div class="space-y-2 pt-2 border-t border-white/10">
            <div class="grid grid-cols-2 gap-2">
              <a href="screen.html?room=${room.code}" target="_blank" class="flex items-center justify-center gap-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-white font-bold py-2 rounded-xl text-xs transition shadow-md">
                <i data-lucide="tv" class="w-3.5 h-3.5"></i>
                <span>開啟大螢幕</span>
              </a>
              <a href="upload.html?room=${room.code}" target="_blank" class="flex items-center justify-center gap-1.5 bg-pink-600/80 hover:bg-pink-600 text-white font-bold py-2 rounded-xl text-xs transition shadow-md">
                <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                <span>手機上傳端</span>
              </a>
            </div>

            <button onclick="copyUploadLink('${room.code}')" class="w-full flex items-center justify-center gap-1.5 bg-white/5 hover:bg-white/10 text-gray-300 py-1.5 rounded-xl text-xs transition border border-white/5">
              <i data-lucide="copy" class="w-3 h-3"></i>
              <span>複製手機上傳專屬連結</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function renderFallbackRooms() {
      const myRecent = JSON.parse(localStorage.getItem("MY_RECENT_ROOMS") || "[]");
      activeRooms = myRecent.map(code => ({ code: code, name: `相片牆 (${code})`, creatorEmail: "本機建立" }));
      renderRoomsGrid();
    }

    function copyUploadLink(code) {
      const url = `${window.location.origin}${window.location.pathname.replace(/\/[^\/]*$/, '')}/upload.html?room=${code}`;
      navigator.clipboard.writeText(url).then(() => {
        alert(`📋 已複製【${code}】手機上傳專屬連結：\n${url}\n可直接發送給該班同學或家長！`);
      });
    }

    function quickJoin(target) {
      const code = document.getElementById("quickCodeInput").value.trim().toLowerCase();
      if (!code) { alert("請輸入班級代碼！"); return; }
      if (target === 'screen') {
        window.open(`screen.html?room=${code}`, '_blank');
      } else {
        window.open(`upload.html?room=${code}`, '_blank');
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      refreshRandomCode();
      lucide.createIcons();
      initFirebase();
    });
  </script>
</body>
</html>
