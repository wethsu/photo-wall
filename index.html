<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📸 即時互動相片牆系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #0f172a 100%);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-between p-6 sm:p-12">

  <!-- Header -->
  <header class="text-center pt-8 max-w-2xl mx-auto">
    <div class="inline-flex items-center justify-center p-4 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-3xl mb-4 shadow-xl shadow-indigo-500/20">
      <i data-lucide="sparkles" class="w-10 h-10 text-white"></i>
    </div>
    <h1 class="text-3xl sm:text-4xl font-black tracking-tight">即時互動相片牆系統</h1>
    <p class="text-gray-300 mt-2 text-sm sm:text-base">全自動無伺服器架構 • 現場手機拍、大螢幕秒同步</p>
  </header>

  <!-- Main Entry Cards -->
  <main class="max-w-4xl mx-auto w-full my-8 grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- 大螢幕投影端 -->
    <a href="screen.html" class="glass-card rounded-3xl p-8 flex flex-col justify-between hover:border-indigo-400 hover:scale-[1.02] transition-all duration-300 shadow-2xl group">
      <div>
        <div class="flex items-center justify-between mb-6">
          <div class="p-3.5 bg-indigo-500/20 text-indigo-400 rounded-2xl border border-indigo-500/30">
            <i data-lucide="tv" class="w-8 h-8"></i>
          </div>
          <span class="text-xs font-bold px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30">
            現場投影主控
          </span>
        </div>
        <h2 class="text-2xl font-black mb-2 text-white group-hover:text-indigo-300 transition">大螢幕展示端</h2>
        <p class="text-gray-400 text-sm leading-relaxed mb-6">
          適合在電視、投影機或主螢幕全螢幕開啟。包含自動輪播、新照片彈出動效與專屬 QR Code。
        </p>
      </div>

      <div class="flex items-center text-sm font-bold text-indigo-400 group-hover:translate-x-1 transition">
        <span>開啟大螢幕端 (screen.html)</span>
        <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
      </div>
    </a>

    <!-- 手機拍照上傳端 -->
    <a href="upload.html" class="glass-card rounded-3xl p-8 flex flex-col justify-between hover:border-pink-400 hover:scale-[1.02] transition-all duration-300 shadow-2xl group">
      <div>
        <div class="flex items-center justify-between mb-6">
          <div class="p-3.5 bg-pink-500/20 text-pink-400 rounded-2xl border border-pink-500/30">
            <i data-lucide="camera" class="w-8 h-8"></i>
          </div>
          <span class="text-xs font-bold px-3 py-1 bg-pink-500/20 text-pink-300 rounded-full border border-pink-500/30">
            手機掃碼使用
          </span>
        </div>
        <h2 class="text-2xl font-black mb-2 text-white group-hover:text-pink-300 transition">手機上傳端</h2>
        <p class="text-gray-400 text-sm leading-relaxed mb-6">
          適合現場同學/賓客以手機開啟。支援原生相機拍攝、前端極速壓縮、留言與上傳進度條。
        </p>
      </div>

      <div class="flex items-center text-sm font-bold text-pink-400 group-hover:translate-x-1 transition">
        <span>前往手機上傳端 (upload.html)</span>
        <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
      </div>
    </a>

  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 pb-4">
    <p>Powered by Pure HTML & Firebase Cloud Services</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
