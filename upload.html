<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>📸 照片即時上傳 - 互動相片牆</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase SDKs (Compat version for single-file portability) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <!-- Centralized Firebase Config -->
  <script src="firebase-config.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .min-h-screen-dvh {
      min-h: 100vh;
      min-height: 100dvh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .gradient-bg {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
    }
    .pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(99, 102, 241, 0); }
      100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
  </style>
</head>
<body class="gradient-bg min-h-screen-dvh min-h-screen flex flex-col justify-between text-gray-800 antialiased p-4 sm:p-6">



  <!-- Header -->
  <header class="text-center pt-2 pb-4 text-white">
    <div class="inline-flex items-center justify-center p-3 bg-white/20 rounded-full mb-2 backdrop-blur-md shadow-inner">
      <i data-lucide="camera" class="w-7 h-7 text-white"></i>
    </div>
    <h1 class="text-2xl font-black tracking-wider drop-shadow-md">即時互動相片牆</h1>
    <div class="mt-2.5 flex flex-col items-center gap-1">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-full text-xs font-mono font-bold cursor-pointer transition shadow-lg border border-white/20" onclick="changeRoomPrompt()" title="點擊切換班級代碼">
        <span class="text-white">🏫 班級：</span>
        <span id="roomBadge" class="text-amber-300 font-black underline text-sm tracking-wider">default</span>
        <i data-lucide="edit-3" class="w-3.5 h-3.5 text-white/90"></i>
      </div>
      <p id="roomHint" class="text-[11px] text-white/75 mt-0.5">點擊上方班級代碼可手動更換</p>
    </div>
    <p class="text-xs text-indigo-100 mt-1 font-medium tracking-wide">拍下精彩瞬間，即刻登上該班大螢幕！</p>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-md mx-auto flex-1 flex flex-col justify-center my-2">

    <!-- 步驟 1: 選擇/拍攝照片 -->
    <div id="stepSelect" class="glass-card rounded-3xl p-6 shadow-2xl space-y-5 text-center transition-all duration-300">
      
      <!-- 隱藏的 Input 元素 -->
      <!-- 1. 直接叫出後鏡頭相機 (capture="environment") -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(event)" />
      <!-- 2. 從相簿中選取 -->
      <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)" />

      <div class="space-y-3 pt-2">
        <button onclick="document.getElementById('cameraInput').click()" class="pulse-ring w-full flex items-center justify-center gap-3 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-bold py-4 px-6 rounded-2xl shadow-xl transition transform active:scale-95 text-lg">
          <i data-lucide="aperture" class="w-6 h-6"></i>
          <span>開啟相機拍照</span>
        </button>

        <button onclick="document.getElementById('galleryInput').click()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-50 text-gray-800 font-bold py-3.5 px-6 rounded-2xl border-2 border-indigo-100 shadow-sm transition transform active:scale-95 text-base">
          <i data-lucide="image" class="w-5 h-5 text-indigo-600"></i>
          <span>從手機相簿選取</span>
        </button>
      </div>

      <div class="flex items-center justify-center space-x-2 text-xs text-gray-500 pt-2 border-t border-gray-100">
        <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>
        <span>前端自動智慧壓縮，極速上傳不卡頓</span>
      </div>
    </div>

    <!-- 步驟 2: 預覽、填寫資訊與上傳 -->
    <div id="stepPreview" class="hidden glass-card rounded-3xl p-6 shadow-2xl space-y-4 transition-all duration-300">
      
      <div class="relative rounded-2xl overflow-hidden bg-black/5 aspect-[4/3] flex items-center justify-center border border-gray-200 shadow-inner">
        <img id="previewImage" src="" alt="預覽圖" class="w-full h-full object-cover" />
        <button onclick="cancelPreview()" class="absolute top-2 right-2 bg-black/60 hover:bg-black/80 text-white p-2 rounded-full backdrop-blur-sm transition shadow">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        <span id="compressInfo" class="absolute bottom-2 left-2 bg-black/70 text-white text-[11px] px-2.5 py-1 rounded-md backdrop-blur-sm">
          壓縮中...
        </span>
      </div>

      <div class="space-y-3 pt-1">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">你的暱稱 / 姓名（選填）</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3 top-3.5 text-gray-400"></i>
            <input type="text" id="authorInput" placeholder="例如：大熊、3號小美" maxlength="15" class="w-full pl-9 pr-3 py-2.5 text-sm bg-white/90 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">留言 / 祝福語（選填）</label>
          <div class="relative">
            <i data-lucide="message-circle" class="w-4 h-4 absolute left-3 top-3.5 text-gray-400"></i>
            <input type="text" id="messageInput" placeholder="給現場留下想說的話..." maxlength="40" class="w-full pl-9 pr-3 py-2.5 text-sm bg-white/90 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>
      </div>

      <button id="uploadBtn" onclick="uploadPhoto()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-base">
        <i data-lucide="send" class="w-5 h-5"></i>
        <span>確認上傳至大螢幕</span>
      </button>
    </div>

    <!-- 步驟 3: 上傳進度條 -->
    <div id="stepUploading" class="hidden glass-card rounded-3xl p-8 shadow-2xl text-center space-y-4">
      <div class="animate-spin inline-flex items-center justify-center p-3 bg-indigo-50 text-indigo-600 rounded-full">
        <i data-lucide="loader-2" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-bold text-gray-800">正在傳送到大螢幕...</h3>
      
      <!-- 進度條 -->
      <div class="w-full bg-gray-200 rounded-full h-3.5 overflow-hidden shadow-inner">
        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-pink-500 h-full rounded-full transition-all duration-200" style="width: 0%"></div>
      </div>
      <p id="progressText" class="text-xs font-mono text-gray-500 font-semibold">0%</p>
    </div>

    <!-- 步驟 4: 上傳成功畫面 -->
    <div id="stepSuccess" class="hidden glass-card rounded-3xl p-8 shadow-2xl text-center space-y-5">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mx-auto shadow-inner">
        <i data-lucide="check-circle-2" class="w-10 h-10"></i>
      </div>
      <div>
        <h3 class="text-2xl font-black text-gray-800">🎉 上傳成功！</h3>
        <p class="text-xs text-gray-600 mt-1 font-medium">快看大螢幕，你的照片已經即時亮相囉！</p>
      </div>

      <button onclick="resetToHome()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span>再拍一張</span>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-[11px] text-white/60 py-2">
    <span>即時互動相片牆 • 雲端極速同步</span>
  </footer>

  <!-- ========================================== -->
  <!-- 核心 JavaScript 邏輯 -->
  <!-- ========================================== -->
  <script>
    // ==========================================
    // 1. Firebase 連線設定 (引用自 firebase-config.js)
    // ==========================================
    const firebaseConfig = window.FIREBASE_CONFIG;
    let db = null;
    let storage = null;

    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
        storage = firebase.storage();
        return true;
      } catch (err) {
        console.error("Firebase 初始化失敗:", err);
        return false;
      }
    }



    // ==========================================
    // 2. 前端圖片選擇與 Canvas 智慧壓縮
    // ==========================================
    let currentBlob = null;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      showStep("stepPreview");
      document.getElementById("compressInfo").innerText = "處理並壓縮中...";

      // 使用 Canvas 壓縮圖片 (1600px 高畫質大螢幕最佳化，確保小於 650KB 秒傳安全線)
      compressImage(file, 1600, 0.78, (blob, originalSize, compressedSize) => {
        currentBlob = blob;
        const previewUrl = URL.createObjectURL(blob);
        document.getElementById("previewImage").src = previewUrl;
        
        const origKB = (originalSize / (1024 * 1024)).toFixed(1);
        const compKB = (compressedSize / 1024).toFixed(0);
        document.getElementById("compressInfo").innerText = `大螢幕畫質最佳化: ${origKB}MB ➔ ${compKB}KB`;
      });

      // 重設 input 讓同檔名也能觸發 change
      event.target.value = "";
    }

    function compressImage(fileOrBlob, maxDimension, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let curMaxDim = maxDimension;
          let curQuality = quality;

          function doCompress() {
            let width = img.width;
            let height = img.height;

            // 計算縮放比例
            if (width > height) {
              if (width > curMaxDim) {
                height = Math.round((height * curMaxDim) / width);
                width = curMaxDim;
              }
            } else {
              if (height > curMaxDim) {
                width = Math.round((width * curMaxDim) / height);
                height = curMaxDim;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              (blob) => {
                // 若 blob 大於 650KB (轉 Base64 會超過 900KB)，自動降規重壓以保證落入 Firestore 安全線內
                if (blob && blob.size > 650 * 1024 && curQuality > 0.5) {
                  curQuality -= 0.12;
                  curMaxDim = Math.round(curMaxDim * 0.85);
                  doCompress();
                } else {
                  callback(blob, (fileOrBlob.size || blob.size), (blob ? blob.size : 0));
                }
              },
              "image/jpeg",
              curQuality
            );
          }

          doCompress();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(fileOrBlob);
    }

    function cancelPreview() {
      currentBlob = null;
      document.getElementById("previewImage").src = "";
      showStep("stepSelect");
    }

    function resetToHome() {
      cancelPreview();
      document.getElementById("messageInput").value = "";
    }

    function showStep(stepId) {
      ["stepSelect", "stepPreview", "stepUploading", "stepSuccess"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(stepId).classList.remove("hidden");
      lucide.createIcons();
    }

    // ==========================================
    // 3. 極速直傳照片至 Firebase Firestore (免 Storage 額度限制，0.3 秒秒傳)
    // ==========================================
    async function uploadPhoto() {
      if (!currentBlob) {
        alert("請先選擇或拍攝照片！");
        return;
      }
      if (!initFirebase()) return;

      const author = document.getElementById("authorInput").value.trim() || "現場同學";
      const message = document.getElementById("messageInput").value.trim() || "";

      showStep("stepUploading");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      if (progressBar) progressBar.style.width = "30%";
      if (progressText) progressText.innerText = "⚡ 正在完成秒傳同步...";

      let uploadTimer = setTimeout(() => {
        alert("上傳連線逾時，請檢查網路連線後重試！");
        showStep("stepPreview");
      }, 15000);

      try {
        let sendBlob = currentBlob;
        // 確保圖片在 600KB 安全線內，Firestore 1MB 限制 100% 容納
        if (sendBlob.size > 600 * 1024) {
          if (progressText) progressText.innerText = "⚡ 正在進行畫質最佳化...";
          sendBlob = await new Promise((resolve) => {
            compressImage(sendBlob, 1400, 0.70, (b) => resolve(b));
          });
        }

        if (progressBar) progressBar.style.width = "65%";
        if (progressText) progressText.innerText = "⚡ 正在同步至大螢幕...";

        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(sendBlob);
        });

        if (progressBar) progressBar.style.width = "85%";

        // 直接寫入 Firestore (完全繞過受限的 Storage，0.3 秒極速上傳)
        await db.collection("photos").add({
          url: base64Data,
          author: author,
          message: message,
          roomId: currentRoomId,
          isDirect: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          timestamp: Date.now()
        });

        clearTimeout(uploadTimer);
        if (progressBar) progressBar.style.width = "100%";
        if (progressText) progressText.innerText = "✅ 上傳成功！";

        showStep("stepSuccess");
        if (typeof confetti === "function") {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      } catch (err) {
        clearTimeout(uploadTimer);
        console.error("上傳失敗:", err);
        alert("上傳失敗：" + (err.message || "網路連線異常，請重試"));
        showStep("stepPreview");
      }
    }

    // ==========================================
    // 班級房間代碼處理
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    let currentRoomId = (urlParams.get('room') || localStorage.getItem('LAST_ROOM_CODE') || 'default').toLowerCase().trim();

    function initRoomBadge() {
      const badge = document.getElementById("roomBadge");
      if (badge) badge.innerText = currentRoomId;
      localStorage.setItem('LAST_ROOM_CODE', currentRoomId);
    }

    function changeRoomPrompt() {
      const input = prompt("請輸入你要上傳的班級專屬代碼 (例如：sjps-0904-8a 或 601)：", currentRoomId);
      if (input !== null && input.trim() !== "") {
        currentRoomId = input.trim().toLowerCase();
        initRoomBadge();
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('room', currentRoomId);
        window.history.replaceState({}, '', newUrl.toString());
      }
    }

    // 初始化 Lucide 圖示
    document.addEventListener("DOMContentLoaded", () => {
      initRoomBadge();
      lucide.createIcons();
      initFirebase();
    });
  </script>
</body>
</html>
