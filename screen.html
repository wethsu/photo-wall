<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📺 大螢幕即時相片牆 - 專業投影展示端</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase SDKs (Compat version for single-file portability) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #070913;
      color: #f8fafc;
      overflow: hidden;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 自訂滾動條 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* 新照片彈跳放大動效 */
    @keyframes newPhotoGlow {
      0% { transform: scale(0.9); opacity: 0; filter: brightness(1.5); }
      40% { transform: scale(1.03); opacity: 1; filter: brightness(1.2); box-shadow: 0 0 70px rgba(168, 85, 247, 0.9); }
      100% { transform: scale(1); opacity: 1; filter: brightness(1); box-shadow: 0 0 35px rgba(168, 85, 247, 0.4); }
    }
    .animate-new-photo {
      animation: newPhotoGlow 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 漸變流光背景動畫 */
    .ambient-glow {
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
      animation: float 22s infinite alternate ease-in-out;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(140px, 90px) scale(1.25); }
    }

    /* 輪播進度條動畫 */
    @keyframes progressCountdown {
      from { width: 0%; }
      to { width: 100%; }
    }
    .progress-active {
      animation: progressCountdown 6s linear forwards;
    }
  </style>
</head>
<body class="relative h-screen w-screen flex flex-col select-none">

  <!-- 背景流光氛圍光效 -->
  <div class="ambient-glow bg-indigo-600 -top-40 -left-40"></div>
  <div class="ambient-glow bg-purple-600 -bottom-40 left-1/3" style="animation-delay: -8s;"></div>
  <div class="ambient-glow bg-pink-600 top-1/4 -right-40" style="animation-delay: -14s;"></div>

  <!-- ========================================== -->
  <!-- Firebase 設定彈窗 -->
  <!-- ========================================== -->
  <div id="configModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
    <div class="bg-gray-900 border border-gray-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 text-white">
      <div class="flex items-center space-x-2 text-indigo-400">
        <i data-lucide="settings" class="w-6 h-6"></i>
        <h3 class="text-xl font-bold">大螢幕端 Firebase 設定</h3>
      </div>
      <p class="text-xs text-gray-300">
        請貼上 Firebase 控制台的 <code class="bg-gray-800 px-1 py-0.5 rounded text-indigo-400 font-mono">firebaseConfig</code> 物件：
      </p>
      <textarea id="configInput" rows="7" class="w-full text-xs font-mono p-3 bg-gray-950 border border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-gray-100"></textarea>
      
      <div>
        <label class="block text-xs font-bold text-gray-400 mb-1">手機上傳端網址 (預設自動對應 GitHub Pages)：</label>
        <input type="text" id="uploadUrlInput" placeholder="https://wethsu.github.io/photo-wall/upload.html" class="w-full text-xs p-2.5 bg-gray-950 border border-gray-700 rounded-xl text-gray-100 focus:ring-2 focus:ring-indigo-500 outline-none font-mono" />
      </div>

      <div class="flex space-x-3 pt-2">
        <button onclick="saveCustomConfig()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition text-sm shadow-lg">
          儲存並重新啟動
        </button>
      </div>
    </div>
  </div>

  <!-- 頂部控制與狀態導覽列 -->
  <header class="relative z-20 flex items-center justify-between px-6 lg:px-8 py-3.5 border-b border-white/10 glass-panel">
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2.5 bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-600 px-4 py-1.5 rounded-xl font-black text-sm shadow-lg shadow-indigo-500/20">
        <i data-lucide="sparkles" class="w-4 h-4 animate-spin" style="animation-duration: 7s;"></i>
        <span class="tracking-wide">即時相片牆 LIVE</span>
      </div>
      <div class="flex items-center space-x-2 text-xs text-gray-400 font-mono">
        <span id="pingDot" class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="connectionStatus" class="text-emerald-400 font-semibold">雲端連線正常</span>
        <span>•</span>
        <span id="photoCount" class="text-gray-300 font-bold">共 0 張照片</span>
      </div>
    </div>

    <!-- 控制按鈕群 -->
    <div class="flex items-center space-x-2.5">
      <!-- 視圖切換：舞台模式 / 網格照片牆 -->
      <button onclick="toggleViewMode()" id="viewModeBtn" title="切換檢視模式 (快捷鍵 V)" class="flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition border border-white/10 text-gray-200">
        <i data-lucide="layout-grid" id="viewModeIcon" class="w-4 h-4 text-purple-400"></i>
        <span id="viewModeText">照片牆模式</span>
      </button>

      <!-- 輪播暫停/播放 -->
      <button id="autoplayBtn" onclick="toggleAutoplay()" title="切換自動輪播 (快捷鍵 Space)" class="flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition border border-white/10">
        <i data-lucide="play" id="autoplayIcon" class="w-4 h-4 text-emerald-400"></i>
        <span id="autoplayText">自動輪播</span>
      </button>

      <!-- 音效開關 -->
      <button id="soundBtn" onclick="toggleSound()" title="新照片音效開關" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition border border-white/10">
        <i data-lucide="volume-2" id="soundIcon" class="w-4 h-4 text-indigo-300"></i>
      </button>

      <!-- 測試照片按鈕 (方便主辦人一鍵體驗效果) -->
      <button onclick="addDemoPhoto()" title="現場測試效果 (一鍵模擬新照片)" class="hidden sm:flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 text-xs font-bold transition border border-indigo-500/30">
        <i data-lucide="sparkle" class="w-3.5 h-3.5"></i>
        <span>模擬效果</span>
      </button>

      <!-- 全螢幕切換 -->
      <button onclick="toggleFullscreen()" title="全螢幕展示 (快捷鍵 F)" class="flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-xs font-bold text-white transition shadow-md">
        <i data-lucide="maximize" class="w-4 h-4"></i>
        <span>全螢幕</span>
      </button>

      <!-- 設定 -->
      <button onclick="openConfigModal()" title="設定" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 transition border border-white/10 text-gray-300">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- 檢視模式 1：焦點主舞台 (Main Stage View) -->
  <!-- ========================================== -->
  <main id="stageView" class="relative z-10 flex-1 flex overflow-hidden p-5 lg:p-6 gap-6">

    <!-- 左/中側：影院級主舞台 -->
    <section class="flex-1 flex flex-col justify-center items-center relative rounded-3xl glass-panel p-2 overflow-hidden border border-white/10 group">
      
      <!-- 空白未有照片狀態 -->
      <div id="emptyState" class="flex flex-col items-center justify-center text-center space-y-4 max-w-md p-6">
        <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-500/20 via-purple-500/20 to-pink-500/20 flex items-center justify-center border border-white/10 shadow-2xl">
          <i data-lucide="camera" class="w-12 h-12 text-indigo-400 animate-bounce"></i>
        </div>
        <h2 class="text-3xl font-black tracking-wide text-white">即時相片牆已就緒</h2>
        <p class="text-sm text-gray-400 leading-relaxed">
          請拿起手機掃描右下角專屬 QR Code<br/>拍下現場第一張精彩照片吧！
        </p>
      </div>

      <!-- 主舞台大圖展示容器 -->
      <div id="stageContainer" class="hidden relative w-full h-full flex flex-col justify-center items-center overflow-hidden rounded-2xl">
        
        <!-- 背景高斯模糊層 (完美填滿 16:9 螢幕，解決手機直式照片兩側黑邊問題) -->
        <img id="stageBgBlur" src="" alt="背景光影" class="absolute inset-0 w-full h-full object-cover filter blur-3xl opacity-35 scale-110 pointer-events-none transition-all duration-700" />

        <!-- 大圖本體 -->
        <div class="relative z-10 max-h-[82vh] max-w-full flex items-center justify-center rounded-2xl overflow-hidden shadow-2xl border border-white/20">
          <img id="mainStageImg" src="" alt="焦點照片" class="max-h-[80vh] max-w-full object-contain rounded-2xl transition-all duration-500 ease-out shadow-2xl" />
          
          <!-- 留言浮層 -->
          <div id="mainCaptionBox" class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-6 flex flex-col justify-end text-white transition-opacity duration-300">
            <div class="flex items-center space-x-3">
              <span id="mainAuthorTag" class="px-3.5 py-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full text-xs font-black tracking-wide shadow-md">
                上傳者
              </span>
              <span id="mainTimeTag" class="text-xs text-gray-300 font-mono">
                剛剛
              </span>
            </div>
            <p id="mainMessageText" class="text-xl font-black text-white mt-2 drop-shadow-lg tracking-wide">
              留言內容
            </p>
          </div>

          <!-- 輪播倒數進度條 -->
          <div class="absolute bottom-0 inset-x-0 h-1 bg-white/20">
            <div id="slideProgressBar" class="h-full bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 w-0"></div>
          </div>
        </div>

        <!-- 左右手動切換箭頭 (Hover 時浮現) -->
        <button onclick="prevPhoto()" class="absolute left-4 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-black/50 hover:bg-black/80 text-white/70 hover:text-white backdrop-blur-md opacity-0 group-hover:opacity-100 transition duration-300">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button onclick="nextPhoto()" class="absolute right-4 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-black/50 hover:bg-black/80 text-white/70 hover:text-white backdrop-blur-md opacity-0 group-hover:opacity-100 transition duration-300">
          <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- 即時新照片提示橫幅 -->
        <div id="newAlertBanner" class="hidden absolute top-5 z-20 bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white px-7 py-2.5 rounded-full font-black text-sm shadow-2xl flex items-center space-x-2 animate-bounce border border-white/30">
          <i data-lucide="bell-ring" class="w-4 h-4"></i>
          <span>🎉 最新照片已同步大螢幕！</span>
        </div>

      </div>

    </section>

    <!-- 右側：縮圖即時串流欄 (Side Stream Rail) -->
    <aside class="w-80 lg:w-96 flex flex-col glass-panel rounded-3xl p-4 border border-white/10 overflow-hidden">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <div class="flex items-center space-x-2">
          <i data-lucide="film" class="w-4 h-4 text-purple-400"></i>
          <h3 class="font-bold text-sm tracking-wide text-gray-200">即時相片串流</h3>
        </div>
        <span class="text-[11px] text-gray-400 font-mono">點擊立即放大</span>
      </div>

      <!-- 縮圖列表容器 -->
      <div id="thumbnailList" class="flex-1 overflow-y-auto space-y-3 pt-3 pr-1">
        <!-- JS 動態插入 -->
      </div>
    </aside>

  </main>

  <!-- ========================================== -->
  <!-- 檢視模式 2：全屏照片網格瀑布流 (Masonry Wall View) -->
  <!-- ========================================== -->
  <main id="wallView" class="hidden relative z-10 flex-1 overflow-y-auto p-6">
    <div id="wallGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
      <!-- JS 動態渲染所有照片卡片 -->
    </div>
  </main>

  <!-- ========================================== -->
  <!-- 右下角浮動專屬 QR Code 卡片 -->
  <!-- ========================================== -->
  <div class="fixed bottom-6 right-8 z-30 flex flex-col items-center">
    <div class="glass-card rounded-2xl p-3.5 shadow-2xl border border-indigo-500/30 flex flex-col items-center space-y-2 hover:scale-105 transition-transform duration-300 cursor-pointer" onclick="toggleQrExpand()" title="點擊放大 QR Code">
      <div class="bg-white p-2 rounded-xl shadow-inner" id="qrcodeContainer">
        <!-- QRCode 由 QRCode.js 自動注入 -->
      </div>
      <div class="text-center">
        <div class="flex items-center justify-center space-x-1 text-xs font-black text-indigo-300">
          <i data-lucide="camera" class="w-3.5 h-3.5"></i>
          <span>手機掃碼拍一張</span>
        </div>
        <p class="text-[10px] text-gray-400 font-mono mt-0.5">即刻登上大螢幕</p>
      </div>
    </div>
  </div>

  <!-- QR Code 點擊全螢幕放大模態框 -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4" onclick="toggleQrExpand()">
    <div class="bg-gray-900 border border-white/20 rounded-3xl p-8 flex flex-col items-center space-y-5 shadow-2xl" onclick="event.stopPropagation()">
      <div class="text-center space-y-1">
        <h3 class="text-2xl font-black text-white">📱 手機掃碼拍照上傳</h3>
        <p class="text-xs text-gray-400">現場所有同學直接用相機掃描即可使用</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-2xl" id="qrcodeLargeContainer"></div>
      <p id="qrUrlLabel" class="text-xs font-mono text-gray-400 break-all max-w-sm text-center"></p>
      <button onclick="toggleQrExpand()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-sm font-bold text-white transition shadow-lg">
        關閉
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 核心 JavaScript 邏輯 -->
  <!-- ========================================== -->
  <script>
    // ==========================================
    // 1. Firebase 金鑰設定
    // ==========================================
    let firebaseConfig = {
      apiKey: "AIzaSyAwlHmSdP4FrGZUmZe7JnL28BcCq09n1P8",
      authDomain: "test-49c68.firebaseapp.com",
      projectId: "test-49c68",
      storageBucket: "test-49c68.firebasestorage.app",
      messagingSenderId: "32127977122",
      appId: "1:32127977122:web:d0c5180e4d89ef680db9fb",
      measurementId: "G-045MJCDSQN"
    };

    let customUploadUrl = "";

    // 優先讀取 localStorage 設定
    const savedConfig = localStorage.getItem("FIREBASE_CUSTOM_CONFIG");
    if (savedConfig) {
      try {
        firebaseConfig = JSON.parse(savedConfig);
      } catch (e) {
        console.error("載入自訂設定失敗:", e);
      }
    }
    const savedUploadUrl = localStorage.getItem("CUSTOM_UPLOAD_URL");
    if (savedUploadUrl) {
      customUploadUrl = savedUploadUrl;
    }

    let db = null;
    let photos = [];
    let currentIndex = 0;
    let autoplayInterval = null;
    let isAutoplay = true;
    let isSoundEnabled = true;
    let isFirstLoad = true;
    let currentViewMode = "stage"; // 'stage' or 'wall'

    function initFirebase() {
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") {
        openConfigModal();
        return false;
      }
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
        listenToPhotos();
        return true;
      } catch (err) {
        console.error("Firebase 初始化失敗:", err);
        showConnectionError("Firebase 連線失敗: " + err.message);
        return false;
      }
    }

    function openConfigModal() {
      document.getElementById("configModal").classList.remove("hidden");
      document.getElementById("configInput").value = JSON.stringify(firebaseConfig, null, 2);
      document.getElementById("uploadUrlInput").value = customUploadUrl;
    }

    function saveCustomConfig() {
      const raw = document.getElementById("configInput").value.trim();
      const urlRaw = document.getElementById("uploadUrlInput").value.trim();
      try {
        const parsed = JSON.parse(raw);
        if (!parsed.apiKey || !parsed.projectId) {
          alert("設定格式不正確，至少需要 apiKey 與 projectId");
          return;
        }
        localStorage.setItem("FIREBASE_CUSTOM_CONFIG", JSON.stringify(parsed));
        if (urlRaw) {
          localStorage.setItem("CUSTOM_UPLOAD_URL", urlRaw);
        } else {
          localStorage.removeItem("CUSTOM_UPLOAD_URL");
        }
        location.reload();
      } catch (err) {
        alert("JSON 格式解析錯誤，請確認貼上的是正確的 JSON 物件！");
      }
    }

    // ==========================================
    // 2. 即時監聽 Firestore 照片集合
    // ==========================================
    function listenToPhotos() {
      // 容錯監聽：不強依賴服務端複合索引，拉取後客戶端即時排序
      db.collection("photos")
        .limit(200)
        .onSnapshot((snapshot) => {
          document.getElementById("connectionStatus").innerText = "雲端連線正常";
          document.getElementById("connectionStatus").className = "text-emerald-400 font-semibold";
          document.getElementById("pingDot").className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping";

          snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
              const photoData = { id: change.doc.id, ...change.doc.data() };
              
              if (!photos.some(p => p.id === photoData.id)) {
                photos.push(photoData);

                if (!isFirstLoad) {
                  onNewPhotoReceived(photoData);
                }
              }
            } else if (change.type === "removed") {
              photos = photos.filter(p => p.id !== change.doc.id);
            }
          });

          // 客戶端精準排序 (最新上傳的在前)
          photos.sort((a, b) => {
            const timeA = a.timestamp || (a.createdAt && a.createdAt.seconds ? a.createdAt.seconds * 1000 : 0);
            const timeB = b.timestamp || (b.createdAt && b.createdAt.seconds ? b.createdAt.seconds * 1000 : 0);
            return timeB - timeA;
          });

          updatePhotoCount();
          renderThumbnailList();
          if (currentViewMode === "wall") renderWallGrid();

          if (isFirstLoad) {
            if (photos.length > 0) {
              setMainStage(0);
            }
            isFirstLoad = false;
          }
        }, (error) => {
          console.error("Firestore 監聽錯誤:", error);
          showConnectionError("資料庫權限未開或連線受阻");
        });
    }

    function showConnectionError(msg) {
      const el = document.getElementById("connectionStatus");
      el.innerText = msg;
      el.className = "text-rose-400 font-semibold cursor-pointer underline";
      el.title = "點擊檢查規則或設定";
      el.onclick = openConfigModal;
      document.getElementById("pingDot").className = "inline-block w-2.5 h-2.5 rounded-full bg-rose-500";
    }

    // ==========================================
    // 3. 即時新照片動態特效與提示
    // ==========================================
    function onNewPhotoReceived(photo) {
      playCelebrationSound();

      if (typeof confetti === "function") {
        confetti({
          particleCount: 120,
          spread: 90,
          origin: { y: 0.5 }
        });
      }

      if (currentViewMode === "stage") {
        currentIndex = 0;
        setMainStage(0, true);

        const banner = document.getElementById("newAlertBanner");
        banner.classList.remove("hidden");
        setTimeout(() => banner.classList.add("hidden"), 5000);
      }
    }

    // Web Audio API 和弦音效
    function playCelebrationSound() {
      if (!isSoundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          
          const startTime = ctx.currentTime + (i * 0.08);
          gain.gain.setValueAtTime(0.01, startTime);
          gain.gain.exponentialRampToValueAtTime(0.2, startTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.6);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.65);
        });
      } catch (e) {
        console.warn("無法播放音效:", e);
      }
    }

    // ==========================================
    // 4. 主舞台切換與渲染
    // ==========================================
    function setMainStage(index, isNewGlow = false) {
      if (!photos[index]) return;
      currentIndex = index;
      const photo = photos[index];

      document.getElementById("emptyState").classList.add("hidden");
      document.getElementById("stageContainer").classList.remove("hidden");

      const img = document.getElementById("mainStageImg");
      const bgBlur = document.getElementById("stageBgBlur");
      
      // 動畫過渡
      img.style.opacity = "0.2";
      setTimeout(() => {
        img.src = photo.url;
        bgBlur.src = photo.url;
        img.onload = () => {
          img.style.opacity = "1";
          if (isNewGlow) {
            img.classList.remove("animate-new-photo");
            void img.offsetWidth;
            img.classList.add("animate-new-photo");
          }
        };
      }, 150);

      document.getElementById("mainAuthorTag").innerText = photo.author || "現場同學";
      document.getElementById("mainMessageText").innerText = photo.message || "📸 分享精彩瞬間！";
      
      const timeMs = photo.timestamp || (photo.createdAt && photo.createdAt.seconds ? photo.createdAt.seconds * 1000 : null);
      const timeStr = timeMs ? new Date(timeMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "剛剛";
      document.getElementById("mainTimeTag").innerText = timeStr;

      highlightActiveThumbnail(index);
      triggerProgressAnimation();
    }

    function prevPhoto() {
      if (photos.length <= 1) return;
      currentIndex = (currentIndex - 1 + photos.length) % photos.length;
      setMainStage(currentIndex);
      resetAutoplayTimer();
    }

    function nextPhoto() {
      if (photos.length <= 1) return;
      currentIndex = (currentIndex + 1) % photos.length;
      setMainStage(currentIndex);
      resetAutoplayTimer();
    }

    function renderThumbnailList() {
      const container = document.getElementById("thumbnailList");
      container.innerHTML = "";

      photos.forEach((photo, idx) => {
        const card = document.createElement("div");
        card.id = `thumb-${idx}`;
        card.onclick = () => {
          if (currentViewMode === "wall") toggleViewMode();
          setMainStage(idx);
          resetAutoplayTimer();
        };

        const isActive = idx === currentIndex;
        card.className = `flex items-center space-x-3 p-2.5 rounded-2xl cursor-pointer transition-all duration-200 border ${
          isActive ? "bg-indigo-600/35 border-indigo-400 shadow-lg scale-[1.02]" : "bg-white/5 hover:bg-white/10 border-white/5"
        }`;

        const timeMs = photo.timestamp || (photo.createdAt && photo.createdAt.seconds ? photo.createdAt.seconds * 1000 : null);
        const timeStr = timeMs ? new Date(timeMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

        card.innerHTML = `
          <img src="${photo.url}" alt="縮圖" class="w-14 h-14 object-cover rounded-xl border border-white/10 shadow-sm flex-shrink-0" />
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-bold text-white truncate">${photo.author || "現場同學"}</h4>
              <span class="text-[10px] text-gray-400 font-mono">${timeStr}</span>
            </div>
            <p class="text-[11px] text-gray-300 truncate mt-0.5">${photo.message || "📷 照片已同步"}</p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function highlightActiveThumbnail(index) {
      photos.forEach((_, i) => {
        const el = document.getElementById(`thumb-${i}`);
        if (el) {
          if (i === index) {
            el.className = "flex items-center space-x-3 p-2.5 rounded-2xl cursor-pointer transition-all duration-200 border bg-indigo-600/35 border-indigo-400 shadow-lg scale-[1.02]";
            el.scrollIntoView({ behavior: "smooth", block: "nearest" });
          } else {
            el.className = "flex items-center space-x-3 p-2.5 rounded-2xl cursor-pointer transition-all duration-200 border bg-white/5 hover:bg-white/10 border-white/5";
          }
        }
      });
    }

    function updatePhotoCount() {
      document.getElementById("photoCount").innerText = `共 ${photos.length} 張照片`;
    }

    // ==========================================
    // 5. 全屏網格照片牆模式 (Wall View)
    // ==========================================
    function toggleViewMode() {
      currentViewMode = currentViewMode === "stage" ? "wall" : "stage";
      const stageEl = document.getElementById("stageView");
      const wallEl = document.getElementById("wallView");
      const modeText = document.getElementById("viewModeText");
      const modeIcon = document.getElementById("viewModeIcon");

      if (currentViewMode === "wall") {
        stageEl.classList.add("hidden");
        wallEl.classList.remove("hidden");
        modeText.innerText = "舞台模式";
        modeIcon.setAttribute("data-lucide", "tv");
        renderWallGrid();
      } else {
        wallEl.classList.add("hidden");
        stageEl.classList.remove("hidden");
        modeText.innerText = "照片牆模式";
        modeIcon.setAttribute("data-lucide", "layout-grid");
        if (photos.length > 0) setMainStage(currentIndex);
      }
      lucide.createIcons();
    }

    function renderWallGrid() {
      const grid = document.getElementById("wallGrid");
      grid.innerHTML = "";
      if (photos.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">目前尚無照片，請手機掃描右下角 QR Code 上傳！</div>`;
        return;
      }
      photos.forEach((photo, idx) => {
        const card = document.createElement("div");
        card.className = "glass-card rounded-2xl overflow-hidden shadow-lg hover:scale-105 transition-transform duration-300 cursor-pointer group";
        card.onclick = () => {
          toggleViewMode();
          setMainStage(idx);
        };
        card.innerHTML = `
          <div class="relative aspect-square">
            <img src="${photo.url}" alt="相片" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-3 flex flex-col justify-end">
              <span class="text-xs font-bold text-white">${photo.author || "現場同學"}</span>
              <p class="text-[11px] text-gray-200 truncate">${photo.message || ""}</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ==========================================
    // 6. 自動輪播與進度條
    // ==========================================
    function startAutoplay() {
      if (autoplayInterval) clearInterval(autoplayInterval);
      triggerProgressAnimation();
      autoplayInterval = setInterval(() => {
        if (!isAutoplay || photos.length <= 1 || currentViewMode !== "stage") return;
        currentIndex = (currentIndex + 1) % photos.length;
        setMainStage(currentIndex);
      }, 6000);
    }

    function triggerProgressAnimation() {
      const bar = document.getElementById("slideProgressBar");
      if (!bar) return;
      bar.classList.remove("progress-active");
      void bar.offsetWidth;
      if (isAutoplay && currentViewMode === "stage") {
        bar.classList.add("progress-active");
      }
    }

    function resetAutoplayTimer() {
      if (isAutoplay) startAutoplay();
    }

    function toggleAutoplay() {
      isAutoplay = !isAutoplay;
      document.getElementById("autoplayText").innerText = isAutoplay ? "自動輪播" : "已暫停";
      document.getElementById("autoplayIcon").className = isAutoplay ? "w-4 h-4 text-emerald-400" : "w-4 h-4 text-gray-400";
      if (isAutoplay) {
        startAutoplay();
      } else {
        if (autoplayInterval) clearInterval(autoplayInterval);
        document.getElementById("slideProgressBar").classList.remove("progress-active");
      }
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      const icon = document.getElementById("soundIcon");
      if (isSoundEnabled) {
        icon.setAttribute("data-lucide", "volume-2");
        icon.className = "w-4 h-4 text-indigo-300";
      } else {
        icon.setAttribute("data-lucide", "volume-x");
        icon.className = "w-4 h-4 text-gray-500";
      }
      lucide.createIcons();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // 鍵盤快捷鍵：F 全螢幕、Space 輪播、V 模式切換、← / → 切換照片
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "f" || e.key === "F") toggleFullscreen();
      else if (e.key === " ") { e.preventDefault(); toggleAutoplay(); }
      else if (e.key === "v" || e.key === "V") toggleViewMode();
      else if (e.key === "ArrowLeft") prevPhoto();
      else if (e.key === "ArrowRight") nextPhoto();
    });

    // ==========================================
    // 7. QR Code 智慧生成
    // ==========================================
    function generateQRCodes() {
      let uploadUrl = customUploadUrl;
      if (!uploadUrl) {
        const loc = window.location.href;
        if (loc.startsWith("file://")) {
          // 本機開啟時自動指向 GitHub Pages 線上網址
          uploadUrl = "https://wethsu.github.io/photo-wall/upload.html";
        } else if (loc.includes("screen.html")) {
          uploadUrl = loc.replace("screen.html", "upload.html");
        } else {
          uploadUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, "/upload.html");
        }
      }

      document.getElementById("qrcodeContainer").innerHTML = "";
      new QRCode(document.getElementById("qrcodeContainer"), {
        text: uploadUrl,
        width: 100,
        height: 100,
        colorDark: "#090d16",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("qrcodeLargeContainer").innerHTML = "";
      new QRCode(document.getElementById("qrcodeLargeContainer"), {
        text: uploadUrl,
        width: 240,
        height: 240,
        colorDark: "#090d16",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById("qrUrlLabel").innerText = uploadUrl;
    }

    function toggleQrExpand() {
      document.getElementById("qrModal").classList.toggle("hidden");
    }

    // 現場模擬測試照片
    function addDemoPhoto() {
      const demoPhotos = [
        { url: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=1200", author: "小明", message: "🎉 大家畢業快樂！" },
        { url: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200", author: "班導師", message: "✨ 最棒的一班，未來加油！" },
        { url: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=1200", author: "小美", message: "🎈 今天的派對太好玩了！" }
      ];
      const randomItem = demoPhotos[Math.floor(Math.random() * demoPhotos.length)];
      const mockPhoto = {
        id: "demo_" + Date.now(),
        url: randomItem.url,
        author: randomItem.author,
        message: randomItem.message,
        timestamp: Date.now()
      };
      photos.unshift(mockPhoto);
      onNewPhotoReceived(mockPhoto);
      updatePhotoCount();
      renderThumbnailList();
    }

    // ==========================================
    // 初始化啟動
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      generateQRCodes();
      initFirebase();
      startAutoplay();

      // iOS / Safari 音效自動解鎖
      const unlockAudio = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            const tempCtx = new AudioContext();
            tempCtx.resume().then(() => tempCtx.close());
          }
        } catch (e) {}
        document.removeEventListener("click", unlockAudio);
        document.removeEventListener("touchstart", unlockAudio);
      };
      document.addEventListener("click", unlockAudio, { once: true });
      document.addEventListener("touchstart", unlockAudio, { once: true });
    });
  </script>
</body>
