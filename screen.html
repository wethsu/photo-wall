<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📺 即時互動相片牆 - 專業投影展示端</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- html2canvas for Direct High-Res Downloads -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    /* 分割模式下隱藏右下角常駐 QR Code 與浮動工具球，避免遮擋照片 */
    body.split-mode #qrFloatCard,
    body.split-mode #floatBall,
    body.split-mode #floatMenu {
      display: none !important;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #070913;
      color: #f8fafc;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 滾動條 */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 99px; }

    /* 新照片動效 */
    @keyframes newPhotoGlow {
      0%   { transform: scale(0.88); opacity: 0; filter: brightness(1.6); }
      45%  { transform: scale(1.04); opacity: 1; box-shadow: 0 0 80px rgba(168,85,247,0.95); }
      100% { transform: scale(1);    opacity: 1; box-shadow: 0 0 35px rgba(168,85,247,0.40); }
    }
    .animate-new-photo { animation: newPhotoGlow 1s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* 環境流光背景 */
    .ambient-glow {
      position: absolute; width: 640px; height: 640px;
      border-radius: 50%; filter: blur(150px); opacity: .22;
      pointer-events: none; z-index: 0;
      animation: floatAnim 22s infinite alternate ease-in-out;
    }
    @keyframes floatAnim {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(130px,85px) scale(1.28); }
    }

    /* 輪播進度條 */
    @keyframes progressCountdown { from { width:0% } to { width:100% } }
    .progress-active { animation: progressCountdown 6s linear forwards; }

    /* ================================================
       分割網格 CSS (絕對精準排版)
    ================================================ */
    .split-grid-container {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 14px;
    }

    /* 二方格 (2格) */
    .grid-layout-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }

    /* 四方格 (4格) */
    .grid-layout-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* 四方格+中間焦點 (5格 - 3欄2列焦點排版) */
    .grid-layout-5 {
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "slot1 center slot3"
        "slot2 center slot4";
    }

    /* 六方格 (6格 - 3欄2列) */
    .grid-layout-6 {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
    }

    /* 八方格 (8格 - 4欄2列) */
    .grid-layout-8 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 1fr 1fr;
    }

    /* 格子卡片樣式 */
    .split-cell {
      position: relative;
      background: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .split-cell:hover {
      border-color: #818cf8;
      box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }
    .split-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 4+1 置中卡片浮動疊加樣式 (可切換前後) */
    .center-overlay-mode {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .center-floating-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46%;
      height: 68%;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid rgba(168, 85, 247, 0.8);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.5);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .center-floating-card.send-to-back {
      opacity: 0.15;
      transform: translate(-50%, -50%) scale(0.85);
      pointer-events: none;
      z-index: 5;
    }
    .center-floating-card.bring-to-front {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      z-index: 25;
    }

    /* ================================================
       浮動工具球 (Floating Toolbar Ball)
    ================================================ */
    #floatBall {
      position: fixed; bottom: 85px; right: 24px; z-index: 200;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg,#6366f1,#a855f7,#ec4899);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 8px 32px rgba(99,102,241,.65);
      transition: transform .2s, box-shadow .2s;
      user-select: none;
    }
    #floatBall:hover { transform: scale(1.12); box-shadow: 0 10px 42px rgba(99,102,241,.85); }

    #floatMenu {
      position: fixed; bottom: 150px; right: 20px; z-index: 199;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
      pointer-events: none; opacity: 0;
      transition: opacity .25s, transform .25s;
      transform: translateY(14px);
    }
    #floatMenu.open { pointer-events: auto; opacity: 1; transform: translateY(0); }
    .float-tool-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px; font-weight: 700; color:#fff;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.2);
      transition: transform .15s, filter .15s;
    }
    .float-tool-btn:hover { transform: scale(1.06) translateX(-3px); filter: brightness(1.15); }

    /* ================================================
       畫筆標注 Canvas
    ================================================ */
    #drawCanvas {
      position: fixed; inset: 0; z-index: 150;
      pointer-events: none; display: none;
      cursor: crosshair;
    }
    body.drawing-mode #drawCanvas { display: block; pointer-events: auto; }

    #drawToolbar {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      z-index: 160; display: none;
      background: rgba(15,23,42,.94); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.18); border-radius: 99px;
      padding: 8px 20px; gap: 12px; align-items: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    body.drawing-mode #drawToolbar { display: flex; }
    .draw-color-btn {
      width: 24px; height: 24px; border-radius: 50%;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color .15s, transform .15s;
    }
    .draw-color-btn.active { border-color: #fff; transform: scale(1.25); }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.85); backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      background: #0f172a; border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px; padding: 28px; width: 100%; max-width: 520px;
      box-shadow: 0 25px 90px rgba(0,0,0,.8);
    }

    /* 照片選擇器 Modal */
    #photoPicker {
      position: fixed; inset: 0; z-index: 280;
      background: rgba(7, 9, 19, 0.95); backdrop-filter: blur(16px);
      display: none; flex-direction: column;
    }
    #photoPicker.open { display: flex; }
    .picker-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px; overflow-y: auto; padding: 20px;
    }
    .picker-thumb {
      position: relative; aspect-ratio: 1;
      border-radius: 14px; overflow: hidden; cursor: pointer;
      border: 3px solid rgba(255,255,255,0.1);
      transition: all .2s;
    }
    .picker-thumb:hover { border-color: #818cf8; transform: scale(1.02); }
    .picker-thumb img { width:100%; height:100%; object-fit: cover; }
    .picker-thumb.selected { border-color: #6366f1; box-shadow: 0 0 20px rgba(99,102,241,0.6); }
    .picker-slot-badge {
      position: absolute; top: 6px; left: 6px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff; font-size: 11px; font-weight: 800;
      padding: 3px 8px; border-radius: 99px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="relative h-screen w-screen flex flex-col select-none">

  <!-- 背景氛圍光效 -->
  <div class="ambient-glow bg-indigo-600" style="top:-160px;left:-160px;"></div>
  <div class="ambient-glow bg-purple-600" style="bottom:-160px;left:30%;animation-delay:-9s;"></div>
  <div class="ambient-glow bg-pink-600"   style="top:20%;right:-160px;animation-delay:-16s;"></div>



  <!-- ====== 頂部導覽列 ====== -->
  <header class="relative z-30 flex items-center justify-between px-6 py-3 border-b border-white/10 glass-panel shrink-0 h-16">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-600 px-4 py-1.5 rounded-xl font-black text-xs shadow-lg shadow-indigo-500/25">
        <i data-lucide="sparkles" class="w-4 h-4 animate-spin" style="animation-duration:7s;"></i>
        <span class="tracking-wide">即時相片牆 LIVE</span>
      </div>
      
      <!-- 班級房間代碼徽章 -->
      <div class="flex items-center gap-1.5 px-3 py-1 bg-indigo-500/20 border border-indigo-500/30 rounded-xl text-xs font-mono font-bold text-indigo-300">
        <span>🏫 班級：</span>
        <span id="headerRoomBadge" class="text-white font-black">default</span>
      </div>

      <div class="flex items-center gap-2 text-xs font-mono">
        <span id="pingDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping inline-block"></span>
        <span id="connectionStatus" class="text-emerald-400 font-bold">雲端連線正常</span>
        <span class="text-gray-500">•</span>
        <span id="photoCount" class="text-gray-300 font-bold">0 張照片</span>
      </div>
    </div>

    <!-- 頂部按鈕群 -->
    <div class="flex items-center gap-2.5">
      
      <!-- 🔀 快速分割選單 (下拉) -->
      <div class="relative" id="splitDropdownWrapper">
        <button onclick="toggleSplitDropdown()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-500/20 to-purple-500/20 hover:from-indigo-500/30 hover:to-purple-500/30 text-indigo-300 text-xs font-black border border-indigo-500/30 transition">
          <i data-lucide="layout-grid" class="w-4 h-4 text-purple-400"></i>
          <span id="currentLayoutLabel">快速分割</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-400"></i>
        </button>
        
        <!-- 下拉選項 -->
        <div id="splitDropdown" class="hidden absolute right-0 top-12 glass-card rounded-2xl shadow-2xl py-2 min-w-[220px] z-50 border border-white/15">
          <div class="px-3.5 py-1 text-[10px] font-black text-gray-400 uppercase tracking-wider">常規模式</div>
          <button onclick="switchToStageMode()" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold"><i data-lucide="tv" class="w-4 h-4 text-indigo-400"></i>焦點大圖主舞台</button>
          <button onclick="switchToWallMode()" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold"><i data-lucide="grid" class="w-4 h-4 text-pink-400"></i>全屏相片瀑布流</button>
          
          <div class="border-t border-white/10 my-1.5"></div>
          <div class="px-3.5 py-1 text-[10px] font-black text-purple-300 uppercase tracking-wider">多圖分割網格</div>
          <button onclick="triggerSplit(2)" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold text-gray-200"><i data-lucide="columns-2" class="w-4 h-4 text-cyan-400"></i>二方格 (左右對比)</button>
          <button onclick="triggerSplit(4)" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold text-gray-200"><i data-lucide="grid-2x2" class="w-4 h-4 text-teal-400"></i>四方格 (2×2 矩陣)</button>
          <button onclick="triggerSplit(5)" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold text-gray-200"><i data-lucide="layout-panel-left" class="w-4 h-4 text-amber-400"></i>4+1 中央焦點 (3欄焦點)</button>
          <button onclick="triggerSplit('5-overlay')" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold text-gray-200"><i data-lucide="layers" class="w-4 h-4 text-purple-400"></i>四方格 + 中間浮層 (可置後)</button>
          <button onclick="triggerSplit(6)" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold text-gray-200"><i data-lucide="grid-3x3" class="w-4 h-4 text-pink-400"></i>六方格 (3×2 矩陣)</button>
          <button onclick="triggerSplit(8)" class="w-full text-left px-4 py-2 text-xs hover:bg-white/10 flex items-center gap-2.5 font-bold text-gray-200"><i data-lucide="grip" class="w-4 h-4 text-rose-400"></i>八方格 (4×2 矩陣)</button>
        </div>
      </div>

      <!-- 輪播控制 -->
      <button onclick="toggleAutoplay()" id="autoplayBtn" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold border border-white/10 transition">
        <i data-lucide="play" id="autoplayIcon" class="w-4 h-4 text-emerald-400"></i>
        <span id="autoplayText">自動輪播</span>
      </button>

      <!-- 音效 -->
      <button onclick="toggleSound()" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 transition">
        <i data-lucide="volume-2" id="soundIcon" class="w-4 h-4 text-indigo-300"></i>
      </button>

      <!-- 模擬照片 -->
      <button onclick="addDemoPhoto()" class="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 text-xs font-bold border border-indigo-500/30 transition">
        <i data-lucide="sparkle" class="w-3.5 h-3.5"></i><span>模擬照片</span>
      </button>

      <!-- 全螢幕 -->
      <button onclick="toggleFullscreen()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-xs font-bold text-white transition shadow-md">
        <i data-lucide="maximize" class="w-4 h-4"></i><span>全螢幕</span>
      </button>
    </div>
  </header>

  <!-- ============================================================
       主內容區域 (Stage / Wall / Split 三大視圖容器)
  ============================================================= -->
  <div class="relative flex-1 w-full overflow-hidden">

    <!-- 1️⃣ 主舞台模式 (Stage View) -->
    <main id="stageView" class="w-full h-full flex p-5 gap-5 overflow-hidden">
      <!-- 左側/中央焦點主舞台 -->
      <section class="flex-1 flex flex-col justify-center items-center relative rounded-3xl glass-panel p-2 overflow-hidden border border-white/10 group">
        
        <!-- 空白狀態 -->
        <div id="emptyState" class="flex flex-col items-center text-center space-y-4 max-w-md p-6">
          <div class="w-20 h-20 rounded-full bg-indigo-500/20 flex items-center justify-center border border-white/10">
            <i data-lucide="camera" class="w-10 h-10 text-indigo-400 animate-bounce"></i>
          </div>
          <h2 class="text-2xl font-black">即時相片牆已就緒</h2>
          <p class="text-sm text-gray-400">掃描右下角 QR Code，拍下第一張精彩照片！</p>
        </div>

        <!-- 主舞台展示大圖 -->
        <div id="stageContainer" class="hidden relative w-full h-full flex flex-col justify-center items-center overflow-hidden rounded-2xl">
          <!-- 模糊背景擴散 -->
          <img id="stageBgBlur" src="" alt="" class="absolute inset-0 w-full h-full object-cover blur-3xl opacity-35 scale-110 pointer-events-none transition-all duration-700"/>
          
          <!-- 大圖本體 -->
          <div class="relative z-10 max-h-[82vh] max-w-full flex items-center justify-center rounded-2xl overflow-hidden shadow-2xl border border-white/20 group/photo">
            <img id="mainStageImg" src="" alt="焦點照片" class="max-h-[80vh] max-w-full object-contain rounded-2xl transition-all duration-500 ease-out shadow-2xl"/>
            
            <!-- 浮層：作者、留言與操作按鈕 -->
            <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/95 via-black/60 to-transparent p-6 flex items-end justify-between text-white">
              <div class="space-y-1">
                <div class="flex items-center gap-3">
                  <span id="mainAuthorTag" class="px-3.5 py-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full text-xs font-black shadow-md">上傳者</span>
                  <span id="mainTimeTag" class="text-xs text-gray-300 font-mono">剛剛</span>
                </div>
                <p id="mainMessageText" class="text-xl font-black drop-shadow-lg">分享精彩瞬間！</p>
              </div>

              <!-- 🗑️ 主舞台刪除按鈕 -->
              <button onclick="deleteCurrentStagePhoto()" title="刪除此張照片" class="flex items-center gap-1.5 px-3 py-1.5 bg-rose-600/80 hover:bg-rose-600 text-white rounded-xl text-xs font-bold transition shadow-lg backdrop-blur-md">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                <span>刪除</span>
              </button>
            </div>

            <!-- 輪播倒數進度條 -->
            <div class="absolute bottom-0 inset-x-0 h-1 bg-white/20">
              <div id="slideProgressBar" class="h-full bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 w-0"></div>
            </div>
          </div>

          <!-- 切換箭頭 -->
          <button onclick="prevPhoto()" class="absolute left-4 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-black/50 hover:bg-black/80 text-white/80 hover:text-white opacity-0 group-hover:opacity-100 transition backdrop-blur-md">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
          </button>
          <button onclick="nextPhoto()" class="absolute right-4 top-1/2 -translate-y-1/2 z-20 p-3 rounded-full bg-black/50 hover:bg-black/80 text-white/80 hover:text-white opacity-0 group-hover:opacity-100 transition backdrop-blur-md">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
          </button>

          <!-- 新照片提示橫幅 -->
          <div id="newAlertBanner" class="hidden absolute top-5 z-20 bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white px-6 py-2 rounded-full font-black text-sm shadow-2xl flex items-center gap-2 animate-bounce border border-white/30">
            <i data-lucide="bell-ring" class="w-4 h-4"></i><span>🎉 最新照片已同步大螢幕！</span>
          </div>
        </div>
      </section>

      <!-- 右側縮圖串流欄 -->
      <aside class="w-80 lg:w-92 flex flex-col glass-panel rounded-3xl p-4 border border-white/10 overflow-hidden shrink-0">
        <div class="flex items-center justify-between pb-3 border-b border-white/10">
          <div class="flex items-center gap-2">
            <i data-lucide="film" class="w-4 h-4 text-purple-400"></i>
            <h3 class="font-bold text-sm text-gray-200">即時相片串流</h3>
          </div>
          <span class="text-[11px] text-gray-400">點擊放大</span>
        </div>
        <div id="thumbnailList" class="flex-1 overflow-y-auto space-y-2.5 pt-3 pr-1"></div>
      </aside>
    </main>

    <!-- 2️⃣ 全屏照片瀑布流模式 (Wall View) -->
    <main id="wallView" class="hidden w-full h-full overflow-y-auto p-6">

  <!-- ============================================================
       核心 JavaScript 邏輯
  ============================================================= -->
  <script>
    // ==========================================
    // 1. Firebase 金鑰設定
    // ==========================================
    let firebaseConfig = {
      apiKey: "AIzaSyAwlHmSdP4FrGZUmZe7JnL28BcCq09n1P8",
      authDomain: "test-49c68.firebaseapp.com",
      projectId: "test-49c68",
      storageBucket: "test-49c68.firebasestorage.app",
      messagingSenderId: "32127977122",
      appId: "1:32127977122:web:d0c5180e4d89ef680db9fb",
      measurementId: "G-045MJCDSQN"
    };

    let customUploadUrl = "";
    localStorage.removeItem("FIREBASE_CUSTOM_CONFIG");

    let db = null;
    let storage = null;
    let photos = [];
    let currentIndex = 0;
    let autoplayInterval = null;
    let isAutoplay = true;
    let isSoundEnabled = true;
    let isFirstLoad = true;
    let currentViewMode = "stage"; // 'stage' | 'wall' | 'split'
    
    // 分割模式狀態
    let currentSplitType = 4; // 2, 4, 5, '5-overlay', 6, 8
    let currentSplitSelections = [];
    let isCenterOverlayFront = true;

    // 班級房間代碼處理 (預設 default)
    const urlParams = new URLSearchParams(window.location.search);
    let currentRoomId = (urlParams.get('room') || 'default').toLowerCase().trim();

    function initFirebase() {
      const roomBadge = document.getElementById("headerRoomBadge");
      if (roomBadge) roomBadge.innerText = currentRoomId;

      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        storage = firebase.storage();
        listenToPhotos();
        return true;
      } catch(err) {
        console.error("Firebase init failed:", err);
        showConnectionError("Firebase 連線異常");
        return false;
      }
    }

    // ==========================================
    // 2. Firestore 即時監聽 (按班級房間代碼隔離)
    // ==========================================
    function listenToPhotos() {
      db.collection("photos").limit(200).onSnapshot((snapshot) => {
        setConnectionOk();
        const allList = [];
        snapshot.forEach((doc) => {
          allList.push({ id: doc.id, ...doc.data() });
        });

        // 依房間過濾 (若是 default 房間，同時相容舊版無 roomId 的照片)
        if (currentRoomId && currentRoomId !== "all") {
          photos = allList.filter(p => {
            if (currentRoomId === 'default') {
              return !p.roomId || p.roomId === 'default';
            }
            return p.roomId === currentRoomId;
          });
        } else {
          photos = allList;
        }

        // 倒序排序 (最新在前)
        photos.sort((a, b) => {
          const ta = a.timestamp || (a.createdAt?.seconds * 1000) || 0;
          const tb = b.timestamp || (b.createdAt?.seconds * 1000) || 0;
          return tb - ta;
        });

        updatePhotoCount();
        renderThumbnailList();
        if (currentViewMode === "wall") renderWallGrid();
        if (currentViewMode === "split") renderSplitGrid();

        if (isFirstLoad) {
          if (photos.length > 0) setMainStage(0);
          isFirstLoad = false;
        }
      }, (error) => {
        console.error("Firestore error:", error);
        showConnectionError("資料庫權限或連線異常");
      });
    }

    function setConnectionOk() {
      document.getElementById("connectionStatus").innerText = "雲端連線正常";
      document.getElementById("connectionStatus").className = "text-emerald-400 font-bold";
      document.getElementById("pingDot").className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping inline-block";
    }
    function showConnectionError(msg) {
      const el = document.getElementById("connectionStatus");
      el.innerText = msg;
      el.className = "text-rose-400 font-bold";
      document.getElementById("pingDot").className = "w-2.5 h-2.5 rounded-full bg-rose-500 inline-block";
    }

    // ==========================================
    // 3. 🗑️ 刪除照片功能 (Firestore + Storage)
    // ==========================================
    async function deletePhotoById(photoId, photoUrl, event) {
      if (event) event.stopPropagation();
      if (!confirm("⚠️ 確定要刪除這張照片嗎？此操作將永久移除此照片。")) return;

      try {
        // 1. 刪除 Firestore Document
        if (db && photoId) {
          await db.collection("photos").doc(photoId).delete();
        }

        // 2. 嘗試刪除 Storage 中的圖檔
        if (storage && photoUrl && (photoUrl.includes("firebasestorage") || photoUrl.includes("storage.googleapis.com"))) {
          try {
            const ref = storage.refFromURL(photoUrl);
            await ref.delete();
          } catch(storageErr) {
            console.warn("Storage 檔案刪除跳過:", storageErr.message);
          }
        }

        // 3. 本地陣列移除
        photos = photos.filter(p => p.id !== photoId);
        updatePhotoCount();
        renderThumbnailList();

        if (currentViewMode === "stage") {
          if (photos.length > 0) {
            currentIndex = currentIndex % photos.length;
            setMainStage(currentIndex);
          } else {
            document.getElementById("emptyState").classList.remove("hidden");
            document.getElementById("stageContainer").classList.add("hidden");
          }
        } else if (currentViewMode === "wall") {
          renderWallGrid();
        } else if (currentViewMode === "split") {
          renderSplitGrid();
        }

        alert("🗑️ 照片已成功刪除！");
      } catch(err) {
        console.error("刪除照片失敗:", err);
        alert("刪除失敗：" + err.message);
      }
    }

    function deleteCurrentStagePhoto() {
      if (!photos[currentIndex]) return;
      deletePhotoById(photos[currentIndex].id, photos[currentIndex].url);
    }

    // ==========================================
    // 4. 新照片提示與音效
    // ==========================================
    function onNewPhotoReceived(photo) {
      playCelebrationSound();
      if (typeof confetti === "function") confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } });

      if (currentViewMode === "stage") {
        currentIndex = 0;
        setMainStage(0, true);
        const b = document.getElementById("newAlertBanner");
        b.classList.remove("hidden");
        setTimeout(() => b.classList.add("hidden"), 5000);
      }
      renderThumbnailList();
      updatePhotoCount();
    }

    function playCelebrationSound() {
      if (!isSoundEnabled) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = "sine"; osc.frequency.value = freq;
          const t = ctx.currentTime + i * 0.08;
          gain.gain.setValueAtTime(0.01, t);
          gain.gain.exponentialRampToValueAtTime(0.2, t + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + 0.65);
        });
      } catch(e) {}
    }

    // ==========================================
    // 5. 焦點主舞台渲染
    // ==========================================
    function setMainStage(index, isNew = false) {
      if (!photos[index]) return;
      currentIndex = index;
      const p = photos[index];
      document.getElementById("emptyState").classList.add("hidden");
      document.getElementById("stageContainer").classList.remove("hidden");
      
      const img = document.getElementById("mainStageImg");
      const bg = document.getElementById("stageBgBlur");
      img.style.opacity = "0.2";
      setTimeout(() => {
        img.src = p.url; bg.src = p.url;
        img.onload = () => {
          img.style.opacity = "1";
          if (isNew) {
            img.classList.remove("animate-new-photo");
            void img.offsetWidth;
            img.classList.add("animate-new-photo");
          }
        };
      }, 150);

      document.getElementById("mainAuthorTag").innerText = p.author || "現場同學";
      document.getElementById("mainMessageText").innerText = p.message || "📸 分享精彩瞬間！";
      const tms = p.timestamp || (p.createdAt?.seconds * 1000);
      document.getElementById("mainTimeTag").innerText = tms ? new Date(tms).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }) : "剛剛";
      highlightActiveThumbnail(index);
      triggerProgressAnimation();
    }

    function prevPhoto() {
      if (photos.length > 1) {
        currentIndex = (currentIndex - 1 + photos.length) % photos.length;
        setMainStage(currentIndex);
        resetAutoplayTimer();
      }
    }
    function nextPhoto() {
      if (photos.length > 1) {
        currentIndex = (currentIndex + 1) % photos.length;
        setMainStage(currentIndex);
        resetAutoplayTimer();
      }
    }

    function renderThumbnailList() {
      const c = document.getElementById("thumbnailList");
      c.innerHTML = "";
      photos.forEach((p, idx) => {
        const d = document.createElement("div");
        d.id = `thumb-${idx}`;
        const isActive = idx === currentIndex && currentViewMode === "stage";

    // ==========================================
    // 7. 🔀 快速分割網格邏輯 (2 / 4 / 5 / 5-overlay / 6 / 8)
    // ==========================================
    const splitTitles = {
      2: "二方格 (左右對比)",
      4: "四方格 (2×2 矩陣)",
      5: "4+1 中央焦點 (3欄焦點)",
      '5-overlay': "四方格 + 中間浮層 (可置後)",
      6: "六方格 (3×2 矩陣)",
      8: "八方格 (4×2 矩陣)"
    };

    function triggerSplit(type) {
      currentSplitType = type;
      closeSplitDropdown();
      const count = (type === '5-overlay') ? 5 : parseInt(type);
      openSplitPicker(count, type);
    }

    function reopenCurrentSplitPicker() {
      const count = (currentSplitType === '5-overlay') ? 5 : parseInt(currentSplitType);
      openSplitPicker(count, currentSplitType);
    }

    function openSplitPicker(slotCount, type) {
      currentSplitSelections = new Array(slotCount).fill(null);
      
      // 預設自動填入最新的照片
      for (let i = 0; i < slotCount && i < photos.length; i++) {
        currentSplitSelections[i] = i;
      }

      document.getElementById("pickerMainTitle").innerText = `設定 ${splitTitles[type] || '分割網格'}`;
      document.getElementById("pickerHint").innerText = `共需 ${slotCount} 格照片。可手動點選，或直接確認套用。`;
      document.getElementById("photoPicker").classList.add("open");
      renderPickerThumbs();
    }

    function cancelSplitPicker() {
      document.getElementById("photoPicker").classList.remove("open");
    }

    function autoFillLatestPhotos() {
      const slotCount = currentSplitSelections.length;
      for (let i = 0; i < slotCount; i++) {
        currentSplitSelections[i] = i < photos.length ? i : null;
      }
      renderPickerThumbs();
    }

    function renderPickerThumbs() {
      const grid = document.getElementById("pickerGrid");
      grid.innerHTML = "";
      const slotCount = currentSplitSelections.length;

      if (!photos.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">目前尚無照片，請先拍照上傳！</div>`;
        return;
      }

      photos.forEach((p, idx) => {
        const slotIndex = currentSplitSelections.indexOf(idx);
        const isSelected = slotIndex !== -1;
        const card = document.createElement("div");
        card.className = `picker-thumb ${isSelected ? 'selected' : ''}`;
        card.onclick = () => togglePickerPhoto(idx);
        
        card.innerHTML = `
          <img src="${p.url}"/>
          ${isSelected ? `<div class="picker-slot-badge">位格 ${slotIndex + 1}</div>` : ''}
          <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-2 text-[11px] font-bold text-white truncate">
            ${p.author || '同學'}
          </div>
        `;
        grid.appendChild(card);
      });

      const filledCount = currentSplitSelections.filter(s => s !== null).length;
      document.getElementById("pickerSelCount").innerText = `已選 ${filledCount} / ${slotCount} 格`;
    }

    function togglePickerPhoto(photoIdx) {
      const existingSlot = currentSplitSelections.indexOf(photoIdx);
      if (existingSlot !== -1) {
        // 取消選取
        currentSplitSelections[existingSlot] = null;
      } else {
        // 尋找第一個空格
        const freeSlot = currentSplitSelections.indexOf(null);
        if (freeSlot !== -1) {
          currentSplitSelections[freeSlot] = photoIdx;
        } else {
          // 若全滿則取代最後一格
          currentSplitSelections[currentSplitSelections.length - 1] = photoIdx;
        }
      }
      renderPickerThumbs();
    }

    function confirmSplitPicker() {
      document.getElementById("photoPicker").classList.remove("open");
      currentViewMode = "split";
      document.body.classList.add("split-mode");
      closeFloatMenu();
      
      document.getElementById("stageView").classList.add("hidden");
      document.getElementById("wallView").classList.add("hidden");
      document.getElementById("splitView").classList.remove("hidden");
      
      document.getElementById("splitTitleTag").innerText = splitTitles[currentSplitType] || "分割呈現";
      document.getElementById("currentLayoutLabel").innerText = splitTitles[currentSplitType] || "分割呈現";

      // 4+1 浮層模式顯示切換按鈕

    function renderSplitGrid() {
      const container = document.getElementById("splitGrid");

      const type = currentSplitType;
      const selections = currentSplitSelections;

      // ====== 模式 A: 四方格 + 中間浮層 (5-overlay) ======

              <div>
                <span class="text-xs font-bold text-purple-300">${photo5.author||"同學"}</span>
                <p class="text-base font-black">${photo5.message||"焦點時刻"}</p>
              </div>
              <button onclick="deletePhotoById('${photo5.id}', '${photo5.url}', event)" title="刪除" class="p-2 bg-rose-600/80 hover:bg-rose-600 rounded-lg text-white transition">

              </button>
            </div>
          `;
        } else {
          centerCard.innerHTML = `
            <div class="w-full h-full flex flex-col items-center justify-center text-gray-400 gap-2">
              <i data-lucide="sparkles" class="w-8 h-8 text-purple-400"></i>
              <span class="font-bold text-sm">中央焦點 (尚未選照片)</span>

      // ====== 模式 B: 常規分割 (2 / 4 / 5 / 6 / 8) ======

      grid.className = `split-grid-container grid-layout-${type}`;

      const totalSlots = (type === 5) ? 5 : parseInt(type);

        const cell = createSplitCell(selections[i], i, totalSlots, type === 5 && i === 2);
        if (type === 5) {
          if (i === 0) cell.style.gridArea = "slot1";
          else if (i === 1) cell.style.gridArea = "slot2";
          else if (i === 2) cell.style.gridArea = "center";
          else if (i === 3) cell.style.gridArea = "slot3";
          else if (i === 4) cell.style.gridArea = "slot4";

        grid.appendChild(cell);

      container.appendChild(grid);
      lucide.createIcons();

            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>

      } else {
        cell.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center text-gray-500 gap-2 bg-slate-900/60" onclick="reopenCurrentSplitPicker()">
            <i data-lucide="plus-circle" class="w-8 h-8 text-indigo-400/60"></i>

    // ==========================================
    // 8. 輪播控制
    // ==========================================
    function startAutoplay() {
      if (autoplayInterval) clearInterval(autoplayInterval);
      triggerProgressAnimation();
      autoplayInterval = setInterval(() => {
        if (!isAutoplay || photos.length <= 1 || currentViewMode !== "stage") return;
        currentIndex = (currentIndex + 1) % photos.length;
        setMainStage(currentIndex);
      }, 6000);
    }

    function triggerProgressAnimation() {
      const bar = document.getElementById("slideProgressBar");
      if (!bar) return;
      bar.classList.remove("progress-active");
      void bar.offsetWidth;
      if (isAutoplay && currentViewMode === "stage") bar.classList.add("progress-active");
    }

    function resetAutoplayTimer() {
      if (isAutoplay) startAutoplay();

      document.getElementById("voteResults").classList.add("hidden");
    }

    // 畫筆標注
    let isDrawing = false, lastX = 0, lastY = 0;
    let drawColor = "#ffffff", isEraser = false;

    // ==========================================
    // 9. 畫筆標注與可拖曳工具列
    // ==========================================
    let isDrawing = false, lastX = 0, lastY = 0;
    let drawColor = "#ffffff", isEraser = false;

    function enterDrawMode() {
      const canvas = document.getElementById("drawCanvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.classList.add("drawing-mode");
      lucide.createIcons();
    }

    function exitDrawMode() {
      clearCanvas();
      document.body.classList.remove("drawing-mode");
      const tb = document.getElementById("drawToolbar");
      if (tb) tb.style.display = "";
    }

    function clearCanvas() {
      const canvas = document.getElementById("drawCanvas");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function setDrawColor(el) {
      document.querySelectorAll(".draw-color-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
      drawColor = el.dataset.color;
      isEraser = false;
      document.getElementById("eraserBtn").style.opacity = "1";
    }

    function toggleEraser() {
      isEraser = !isEraser;
      document.getElementById("eraserBtn").style.opacity = isEraser ? "0.5" : "1";
      document.getElementById("eraserBtn").style.background = isEraser ? "rgba(255,255,255,0.3)" : "";
    }

    const dc = document.getElementById("drawCanvas");
    function getPos(e) {
      const r = dc.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
      }
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function drawStart(e) {
      isDrawing = true;
      const p = getPos(e);
      lastX = p.x; lastY = p.y;
    }
    function drawMove(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const p = getPos(e);
      const ctx = dc.getContext("2d");
      ctx.globalCompositeOperation = isEraser ? "destination-out" : "source-over";
      ctx.strokeStyle = drawColor;
      ctx.lineWidth = isEraser ? parseInt(document.getElementById("brushSize").value) * 3 : parseInt(document.getElementById("brushSize").value);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    }
    function drawEnd() { isDrawing = false; }

    dc.addEventListener("mousedown", drawStart);
    dc.addEventListener("mousemove", drawMove);
    dc.addEventListener("mouseup", drawEnd);
    dc.addEventListener("touchstart", drawStart, { passive: true });
    dc.addEventListener("touchmove", drawMove, { passive: false });
    dc.addEventListener("touchend", drawEnd);

    // 工具列拖曳移動
    function initDraggableToolbar() {
      const tb = document.getElementById("drawToolbar");
      const handle = document.getElementById("drawToolbarDragHandle") || tb;
      if (!tb) return;

      let isDraggingTb = false;
      let startMouseX = 0, startMouseY = 0;
      let initLeft = 0, initTop = 0;

      const onStart = (clientX, clientY, target) => {
        if (target && (target.tagName === "BUTTON" || target.tagName === "INPUT" || target.classList.contains("draw-color-btn"))) {
          return;
        }
        isDraggingTb = true;
        const rect = tb.getBoundingClientRect();
        initLeft = rect.left;
        initTop = rect.top;
        startMouseX = clientX;
        startMouseY = clientY;
        tb.style.transform = "none";
        tb.style.left = `${initLeft}px`;
        tb.style.top = `${initTop}px`;
      };

      handle.addEventListener("mousedown", (e) => onStart(e.clientX, e.clientY, e.target));
      handle.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) onStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
      }, { passive: true });

      const onMove = (clientX, clientY) => {
        if (!isDraggingTb) return;
        const dx = clientX - startMouseX;
        const dy = clientY - startMouseY;
        let newX = initLeft + dx;
        let newY = initTop + dy;

        const pad = 10;
        const maxW = window.innerWidth - tb.offsetWidth - pad;
        const maxH = window.innerHeight - tb.offsetHeight - pad;
        newX = Math.max(pad, Math.min(newX, maxW));
        newY = Math.max(pad, Math.min(newY, maxH));

        tb.style.left = `${newX}px`;
        tb.style.top = `${newY}px`;
      };

      window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
      window.addEventListener("touchmove", (e) => {
        if (isDraggingTb && e.touches.length > 0) {
          onMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      const onEnd = () => { isDraggingTb = false; };
      window.addEventListener("mouseup", onEnd);
      window.addEventListener("touchend", onEnd);
    }

    // ==========================================
    // 10. 📥 高清直接下載到電腦 (True 2K Aspect Ratio Composer)
    // ==========================================
    function showToast(msg) {
      const existing = document.getElementById("toastNotify");
      if (existing) existing.remove();

      const toast = document.createElement("div");
      toast.id = "toastNotify";
      toast.className = "fixed top-20 left-1/2 -translate-x-1/2 z-[400] bg-emerald-600/95 text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow-2xl backdrop-blur-md flex items-center gap-2 border border-emerald-400/40 animate-bounce";
      toast.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-white"></i><span>${msg}</span>`;
      document.body.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 3500);
    }

    function drawImageCover(ctx, imgEl, dx, dy, dw, dh, fitMode = 'cover') {
      return new Promise((resolve) => {
        const handleDraw = (img) => {
          const nw = img.naturalWidth || img.width;
          const nh = img.naturalHeight || img.height;
          if (!nw || !nh) { resolve(); return; }

          const imgRatio = nw / nh;
          const targetRatio = dw / dh;

          let sx = 0, sy = 0, sw = nw, sh = nh;
          let finalDx = dx, finalDy = dy, finalDw = dw, finalDh = dh;

          if (fitMode === 'cover') {
            if (imgRatio > targetRatio) {
              sw = Math.round(nh * targetRatio);
              sx = Math.round((nw - sw) / 2);
            } else {
              sh = Math.round(nw / targetRatio);
              sy = Math.round((nh - sh) / 2);
            }
          } else if (fitMode === 'contain') {
            if (imgRatio > targetRatio) {
              finalDh = Math.round(dw / imgRatio);
              finalDy = dy + Math.round((dh - finalDh) / 2);
            } else {
              finalDw = Math.round(dh * imgRatio);
              finalDx = dx + Math.round((dw - finalDw) / 2);
            }
          }

          try {
            ctx.drawImage(img, sx, sy, sw, sh, finalDx, finalDy, finalDw, finalDh);
            resolve();
          } catch(e) {
            const tempImg = new Image();
            tempImg.crossOrigin = "anonymous";
            tempImg.onload = () => {
              try {
                ctx.drawImage(tempImg, sx, sy, sw, sh, finalDx, finalDy, finalDw, finalDh);
              } catch(err) {}
              resolve();
            };
            tempImg.onerror = () => resolve();
            tempImg.src = img.src;
          }
        };

        if (imgEl.complete && imgEl.naturalWidth > 0) {
          handleDraw(imgEl);
        } else {
          const tempImg = new Image();
          tempImg.crossOrigin = "anonymous";
          tempImg.onload = () => handleDraw(tempImg);
          tempImg.onerror = () => resolve();
          tempImg.src = imgEl.src;
        }
      });
    }

    async function captureViewAsImage(viewMode, includeDrawing = false, btnElement = null) {
      let originalBtnHtml = "";
      if (btnElement) {
        originalBtnHtml = btnElement.innerHTML;
        btnElement.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i><span>合成下載中...</span>`;
        btnElement.disabled = true;
        lucide.createIcons();
      }

      try {
        const dpr = 2; // 2x 超高清
        let targetEl = null;
        if (viewMode === "split") {
          targetEl = document.getElementById("splitGridWrapper") || document.getElementById("splitGrid");
        } else if (viewMode === "stage") {
          targetEl = document.getElementById("stageContainer") || document.getElementById("stageView");
        } else if (viewMode === "wall") {
          targetEl = document.getElementById("wallView");
        } else {
          targetEl = document.body;
        }

        const rect = targetEl.getBoundingClientRect();
        const width = Math.round(rect.width * dpr);
        const height = Math.round(rect.height * dpr);

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        // 1. 深色背景底色
        ctx.fillStyle = "#070913";
        ctx.fillRect(0, 0, width, height);

        // 2. 繪製視圖內容 (保持真實比例，絕不壓扁變形)
        if (viewMode === "split") {
          const cells = targetEl.querySelectorAll(".split-cell, #centerFloatingCard");
          for (const cell of cells) {
            const cRect = cell.getBoundingClientRect();
            const x = Math.round((cRect.left - rect.left) * dpr);
            const y = Math.round((cRect.top - rect.top) * dpr);
            const w = Math.round(cRect.width * dpr);
            const h = Math.round(cRect.height * dpr);
            const radius = Math.round(18 * dpr);

            ctx.save();
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, radius);
            else ctx.rect(x, y, w, h);
            ctx.clip();

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(x, y, w, h);

            const img = cell.querySelector("img");
            if (img && img.src) {
              await drawImageCover(ctx, img, x, y, w, h, 'cover');
            }

            // 底部作者與留言漸層 (無任何「位格1/2」標籤文字)
            const authorEl = cell.querySelector("span");
            const msgEl = cell.querySelector("p");
            const author = authorEl ? authorEl.innerText.trim() : "";
            const msg = msgEl ? msgEl.innerText.trim() : "";

            if (author || msg) {
              const gradH = Math.round(65 * dpr);
              const grad = ctx.createLinearGradient(x, y + h - gradH, x, y + h);
              grad.addColorStop(0, "rgba(0,0,0,0)");
              grad.addColorStop(1, "rgba(0,0,0,0.85)");
              ctx.fillStyle = grad;
              ctx.fillRect(x, y + h - gradH, w, gradH);

              if (author) {
                ctx.fillStyle = "#818cf8";
                ctx.font = `bold ${Math.round(12 * dpr)}px 'Noto Sans TC', -apple-system, sans-serif`;
                ctx.fillText(author, x + Math.round(14 * dpr), y + h - Math.round(28 * dpr));
              }
              if (msg) {
                ctx.fillStyle = "#f8fafc";
                ctx.font = `${Math.round(11 * dpr)}px 'Noto Sans TC', -apple-system, sans-serif`;
                ctx.fillText(msg, x + Math.round(14 * dpr), y + h - Math.round(10 * dpr));
              }
            }

            ctx.restore();

            // 圓角邊框
            ctx.save();
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, radius);
            else ctx.rect(x, y, w, h);
            ctx.strokeStyle = "rgba(255,255,255,0.15)";
            ctx.lineWidth = Math.round(2 * dpr);
            ctx.stroke();
            ctx.restore();
          }
        } else if (viewMode === "stage") {
          const img = document.getElementById("mainStageImg");
          if (img && img.src) {
            const iRect = img.getBoundingClientRect();
            const ix = Math.round((iRect.left - rect.left) * dpr);
            const iy = Math.round((iRect.top - rect.top) * dpr);
            const iw = Math.round(iRect.width * dpr);
            const ih = Math.round(iRect.height * dpr);

            ctx.save();
            const radius = Math.round(16 * dpr);
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(ix, iy, iw, ih, radius);
            else ctx.rect(ix, iy, iw, ih);
            ctx.clip();
            await drawImageCover(ctx, img, ix, iy, iw, ih, 'contain');
            ctx.restore();
          }
        } else {
          if (typeof html2canvas !== 'undefined') {
            const htmlCanvas = await html2canvas(targetEl, { useCORS: true, allowTaint: true, scale: dpr, backgroundColor: '#070913', logging: false });
            ctx.drawImage(htmlCanvas, 0, 0, width, height);
          }
        }

        // 3. 標註圖繪製：僅截取與目標視圖相同範圍的畫筆線條 (絕非全螢幕)
        if (includeDrawing) {
          const drawCanvas = document.getElementById("drawCanvas");
          if (drawCanvas) {
            ctx.drawImage(
              drawCanvas,
              rect.left, rect.top, rect.width, rect.height,
              0, 0, width, height
            );
          }
        }

        // 4. 下載到電腦
        const imgData = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        const d = new Date();
        const ts = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
        const prefix = includeDrawing ? `photo-wall-annotated-${currentRoomId}` : `photo-wall-${viewMode}-${currentRoomId}`;
        a.download = `${prefix}_${ts}.png`;
        a.href = imgData;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        showToast("✅ 已成功下載高清圖片到電腦！");
      } catch(err) {
        console.error("下載圖片失敗:", err);
        alert("下載失敗：" + err.message);
      } finally {
        if (btnElement) {
          btnElement.innerHTML = originalBtnHtml;
          btnElement.disabled = false;
          lucide.createIcons();
        }
      }
    }

    // 1. 分割畫面直接下載
    function downloadSplitViewImage(btn) {
      captureViewAsImage("split", false, btn);
    }

    // 2. 標注好的圖下載 (限制在視圖相同範圍，合成底圖 + 筆跡)
    function downloadDrawnCanvas(btn) {
      captureViewAsImage(currentViewMode, true, btn);
    }

    // 3. 截圖存儲
    function saveScreenshot(btn) {
      captureViewAsImage(currentViewMode, false, btn);
    }

    // ==========================================
    // 10. QR Code 生成 (精準綁定當前班級 roomId)
    // ==========================================
    function generateQRCodes() {
      let uploadUrl = customUploadUrl;
      if (!uploadUrl) {
        const loc = window.location.href;
        if (loc.startsWith("file://")) uploadUrl = "https://wethsu.github.io/photo-wall/upload.html";
        else if (loc.includes("screen.html")) uploadUrl = loc.replace("screen.html", "upload.html");
        else uploadUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, "/upload.html");
      }

      // 自動加上 ?room=roomId 參數，保證掃碼進正確班級
      if (!uploadUrl.includes("room=")) {
        uploadUrl += (uploadUrl.includes("?") ? "&" : "?") + `room=${encodeURIComponent(currentRoomId)}`;
      }

      const genOpts = (el, size) => {
        el.innerHTML = "";
        new QRCode(el, { text: uploadUrl, width: size, height: size, colorDark: "#090d16", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      };
      genOpts(document.getElementById("qrcodeContainer"), 90);
      genOpts(document.getElementById("qrcodeLargeContainer"), 240);
      document.getElementById("qrUrlLabel").innerText = uploadUrl;
      const roomLbl = document.getElementById("qrRoomCodeLabel");
      if (roomLbl) roomLbl.innerText = `班級：${currentRoomId}`;
    }

    function toggleQrExpand() { document.getElementById("qrModal").classList.toggle("hidden"); }

    // 模擬測試照片 (自動綁定當前班級)
    function addDemoPhoto() {
      const demos = [
        { url: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=1200", author: "小明", message: "🎉 畢業快樂！" },
        { url: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200", author: "班導師", message: "✨ 大家未來加油！" },
        { url: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=1200", author: "小美", message: "🎈 今天的活動超棒！" },
        { url: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1200", author: "大東", message: "🔥 現場氣氛太嗨啦" }
      ];
      const r = demos[Math.floor(Math.random() * demos.length)];
      const m = { id: "demo_" + Date.now(), ...r, roomId: currentRoomId, timestamp: Date.now() };
      photos.unshift(m);
      onNewPhotoReceived(m);
      updatePhotoCount();
      renderThumbnailList();
    }

    // 鍵盤快捷鍵
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (document.body.classList.contains("drawing-mode") && e.key === "Escape") { exitDrawMode(); return; }
      const k = e.key;
      if (k === "f" || k === "F") toggleFullscreen();
      else if (k === " ") { e.preventDefault(); toggleAutoplay(); }
      else if (k === "ArrowLeft") prevPhoto();
      else if (k === "ArrowRight") nextPhoto();
      else if (k === "Escape") { closeConfigModal(); closeVoteModal(); closeSplitDropdown(); }
    });

    // 初始化
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      generateQRCodes();
      initFirebase();
      startAutoplay();
      initDraggableToolbar();

      const unlock = () => {
        try { const A = window.AudioContext || window.webkitAudioContext; if(A) { const c = new A(); c.resume().then(() => c.close()); } } catch(e) {}
      };
      document.addEventListener("click", unlock, { once: true });
      document.addEventListener("touchstart", unlock, { once: true });
    });
  </script>
